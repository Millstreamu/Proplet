/* ─────────────────────────────────────────────────────────────────────────
   Pixel Studio — Sprite Ed.
   Faithful standalone implementation of the Claude Design prototype
   "Pixel Studio.dc.html". The whole app is one React component; the design
   template is reproduced in render(), the interaction logic is reused as-is.
   ───────────────────────────────────────────────────────────────────────── */

/* css("a:b;c:d") -> React style object. Keeps custom props (--x) verbatim and
   camelCases the rest. Values never contain ';', so a plain split is safe. */
function css(str){
  const o = {};
  if (!str) return o;
  str.split(';').forEach(part => {
    const i = part.indexOf(':');
    if (i < 0) return;
    const k = part.slice(0, i).trim();
    const val = part.slice(i + 1).trim();
    if (!k) return;
    const key = k.startsWith('--') ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[key] = val;
  });
  return o;
}

/* Hoverable element: reproduces the prototype's style-hover behaviour.
   s = base style string, sh = hover style string, sx/hx = dynamic overrides. */
function Hov(props){
  const { s, sh, sx, hx, tag = 'button', children, onMouseEnter, onMouseLeave, ...rest } = props;
  const [h, setH] = React.useState(false);
  const style = { ...css(s), ...(sx || {}), ...(h ? css(sh) : {}), ...(h && hx ? hx : {}) };
  return React.createElement(tag, {
    ...rest, style,
    onMouseEnter: e => { setH(true); if (onMouseEnter) onMouseEnter(e); },
    onMouseLeave: e => { setH(false); if (onMouseLeave) onMouseLeave(e); }
  }, children);
}

/* Text input that commits on blur / Enter (matches the prototype's onChange
   inputs, which fire on commit rather than per keystroke). */
function CommitInput(props){
  const { value, commit, ...rest } = props;
  const [editing, setEditing] = React.useState(false);
  const [local, setLocal] = React.useState(value);
  React.useEffect(() => { if (!editing) setLocal(value); }, [value, editing]);
  const done = val => { setEditing(false); commit({ target: { value: val } }); };
  return React.createElement('input', {
    ...rest,
    value: editing ? local : value,
    onChange: e => { setEditing(true); setLocal(e.target.value); },
    onBlur: e => done(local),
    onKeyDown: e => { if (e.key === 'Enter') { done(e.target.value); e.target.blur(); } }
  });
}

const PALETTE = ['#15130f','#3b2f2a','#6b4f3a','#a8763f','#e1ad66','#f2d9a0','#f6f2e8','#ffffff','#3d1329','#7a2d52','#c2417a','#f07fae','#ffd0e2','#1b2c3a','#2f5670','#3f6d8c','#6fb0c9','#bfe3ef','#3f6b45','#7fbf6a'];
const RAMPS = [
  { name:'Glass — cool blues', colors:['#1b2c3a','#2f5670','#3f6d8c','#6fb0c9','#bfe3ef'] },
  { name:'Potion — rose', colors:['#3d1329','#7a2d52','#c2417a','#f07fae','#ffd0e2'] },

];

function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgb2hex(r,g,b){ const c=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0'); return '#'+c(r)+c(g)+c(b); }
function shade(h,amt){ const [r,g,b]=hex2rgb(h); return amt>0 ? rgb2hex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt) : rgb2hex(r*(1+amt), g*(1+amt), b*(1+amt)); }
function mix(a,b,t){ const A=hex2rgb(a), B=hex2rgb(b); return rgb2hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }

const ONION_PREV = '#c2417a', ONION_NEXT = '#6fb0c9';
const AUTO_KEY = 'pixelstudio.autosave.v1';
const TAG_COLORS = ['#7fbf6a','#6fb0c9','#c2417a','#e1ad66','#f07fae','#bfe3ef'];

/* Read-only readability label derived from a tile's 4 corner terrains
   [TL,TR,BR,BL] under the Wang corner model. The corner data is what's stored;
   this is only shown to the user. */
function cornerLabel(cn){
  if (!cn || cn.length !== 4 || cn.some(c => !c)) return 'unset';
  const [tl,tr,br,bl] = cn;
  const u = new Set(cn);
  if (u.size === 1) return 'fill';
  if (u.size === 2){
    if (tl===tr && bl===br && tl!==bl) return 'edge (N–S)';
    if (tl===bl && tr===br && tl!==tr) return 'edge (E–W)';
    if (tl===br && tr===bl) return 'inner corner';
    return 'outer corner';
  }
  return 'junction';
}

const TILE_KINDS = ['ground','terrain','decor','collision','animated'];
const ATLAS_KINDS = ['decor','prop','ground','collision','animated'];

/* Growing binary-tree rectangle packer — nests variably-sized sprites into one
   sheet like a texture atlas. Returns per-input {x,y} plus the sheet w/h. */
function packRects(boxes){
  const order = boxes.map((b,i)=>({ w:b.w, h:b.h, i })).sort((a,b)=> Math.max(b.w,b.h)-Math.max(a.w,a.h) || (b.h-a.h) || (b.w-a.w));
  let root = null;
  const find = (n,w,h) => { if(!n) return null; if(n.used) return find(n.right,w,h) || find(n.down,w,h); return (w<=n.w && h<=n.h) ? n : null; };
  const split = (n,w,h) => { n.used=true; n.down={x:n.x,y:n.y+h,w:n.w,h:n.h-h}; n.right={x:n.x+w,y:n.y,w:n.w-w,h:h}; return n; };
  const growRight = (w,h) => { root={used:true,x:0,y:0,w:root.w+w,h:root.h,down:root,right:{x:root.w,y:0,w:w,h:root.h}}; const n=find(root,w,h); return n?split(n,w,h):null; };
  const growDown = (w,h) => { root={used:true,x:0,y:0,w:root.w,h:root.h+h,down:{x:0,y:root.h,w:root.w,h:h},right:root}; const n=find(root,w,h); return n?split(n,w,h):null; };
  const grow = (w,h) => {
    const canDown=w<=root.w, canRight=h<=root.h;
    if(canRight && (root.h >= root.w + w)) return growRight(w,h);
    if(canDown && (root.w >= root.h + h)) return growDown(w,h);
    if(canRight) return growRight(w,h);
    if(canDown) return growDown(w,h);
    return null;
  };
  const pos = new Array(boxes.length);
  order.forEach(b => {
    if(!root){ root={x:0,y:0,w:b.w,h:b.h}; }
    let n = find(root,b.w,b.h);
    n = n ? split(n,b.w,b.h) : grow(b.w,b.h);
    pos[b.i] = n ? {x:n.x, y:n.y} : {x:0, y:0};
  });
  return { pos, w: root?root.w:0, h: root?root.h:0 };
}

class Component extends React.Component {
  constructor(p){
    super(p);
    const w = 32, h = 32;
    this.state = {
      w, h, frames:this.demoFrames(w,h), active:0, tool:'pencil',
      projectName:'player_walk', named:false, dirty:false, savedAt:null,
      autoState:'idle', autoAt:null, restore:null, pending:null,
      workspace:'frames',
      tags:[
        { id:'t1', name:'Idle', start:1, end:4, mode:'Forward', color:'#7fbf6a' },
        { id:'t2', name:'Walk', start:5, end:8, mode:'Forward', color:'#6fb0c9' },
        { id:'t3', name:'Attack', start:9, end:12, mode:'Forward', color:'#c2417a' }
      ],
      activeTag:'t2', tagEdit:null,
      tiles:this.demoTiles(w,h), activeTile:0, wrap:false, tilePreview:3,
      terrains:['grass','dirt','water'], terrainDraft:'',
      ref:null, refOn:true, refOpacity:45, refScale:100, refX:0, refY:0, refMove:false,
      atlas:[], activeAtlas:0, atlasExport:{ spacing:1, padding:1, transparent:true }, atlasSheetOpen:false,
      tileExport:{ layout:'grid', cols:4, spacing:0, padding:0, transparent:true },
      tileSheetOpen:false, newOpen:false, saveAs:null,
      npName:'untitled', npW:32, npH:32, npTransparent:true,
      exportScope:'all',
      fg:'#c2417a', bg:'#15130f', palette:PALETTE.slice(), recent:['#c2417a','#f07fae','#6fb0c9','#a8763f'],
      ramps:RAMPS.map(r=>({...r, colors:r.colors.slice()})),
      shadeMode: p.shadeModeDefault === 'Basic RGB' ? 'rgb' : 'ramp',
      cell:15, grid:p.showGridDefault !== false, tile:!!p.tileDefault,
      mirrorH:false, mirrorV:false, shapeFill:false,
      onion:{ on:!!p.onionDefault, prev:1, next:1, opacity:p.onionOpacityDefault || 35 },
      selRect:null, clip:null,
      playing:false, previewIdx:0,
      hover:null, hint:'Drag on the canvas to draw — press S for the selection tool', sheetOpen:false,
      menu:null, tfx:null,
      layout:'grid', cols:4, spacing:2, padding:4, transparent:true, onlySelected:false, showCells:true
    };
    this.mainRef = React.createRef();
    this.previewRef = React.createRef();
    this.sheetRef = React.createRef();
    this.tfxRef = React.createRef();
    this.fileRef = React.createRef();
    this.projRef = React.createRef();
    this.tileSheetRef = React.createRef();
    this.atlasSheetRef = React.createRef();
    this.refInputRef = React.createRef();
    this.thumbs = {}; this.thumbRefs = {};
    this.undoStack = []; this.redoStack = [];
  }

  /* ── example sprite: a potion flask, four bobbing frames ── */
  sprite(f, W, H){
    if (W < 16 || H < 16) return new Array(W*H).fill(null);
    const OUT='#15130f', GL='#2f5670', GLH='#6fb0c9', CK='#6b4f3a', CKH='#a8763f';
    const LQ='#c2417a', LQL='#f07fae', LQD='#7a2d52', SP='#e1ad66';
    const at=(x,y)=> (x<0||x>=32||y<0||y>=32) ? -1 : y*32+x;
    const buf = new Array(32*32).fill(null);
    const set=(x,y,c)=>{ const i=at(x,y); if(i>=0) buf[i]=c; };
    const get=(x,y)=>{ const i=at(x,y); return i<0?null:buf[i]; };

    for (let y=0;y<32;y++) for (let x=0;x<32;x++){
      const dx=x-15.5, dy=y-21.5;
      if (dx*dx+dy*dy <= 8.7*8.7) set(x,y,GL);
    }
    for (let y=9;y<=14;y++) for (let x=13;x<=18;x++) set(x,y,GL);
    for (let y=5;y<=8;y++) for (let x=13;x<=18;x++) set(x,y,CK);
    for (let y=7;y<=8;y++) for (let x=12;x<=19;x++) set(x,y,CK);
    for (let y=5;y<=8;y++){ set(14,y,CKH); }
    set(15,5,CKH);

    const level = 18 + (f===1?-1:0) + (f===3?1:0);
    for (let x=0;x<32;x++){
      const surf = level + (Math.sin((x + f*3)/2.4) > 0 ? 0 : 1);
      for (let y=surf;y<32;y++){
        if (get(x,y)===GL) set(x,y, y===surf ? LQL : (y>=27 ? LQD : LQ));
      }
    }
    const bubbles = [[[13,26],[18,28]],[[13,24],[18,26]],[[13,22],[18,24]],[[14,20],[17,22]]][f%4];
    bubbles.forEach(([bx,by])=>{ if(get(bx,by)===LQ||get(bx,by)===LQD) set(bx,by,LQL); });
    for (let y=16;y<=22;y++){ if (get(11,y)===GL) set(11,y,GLH); }
    if (get(12,15)===GL) set(12,15,GLH);
    for (let y=10;y<=13;y++) if (get(14,y)===GL) set(14,y,GLH);
    if (f%2===1){ set(22,6,SP); set(9,9,SP); } else { set(23,10,SP); }

    const snap = buf.slice();
    for (let y=0;y<32;y++) for (let x=0;x<32;x++){
      if (!snap[at(x,y)]) continue;
      const n = [[1,0],[-1,0],[0,1],[0,-1]];
      if (n.some(([a,b]) => { const i=at(x+a,y+b); return i<0 || !snap[i]; })) buf[at(x,y)] = OUT;
    }

    if (W === 32 && H === 32) return buf;
    const out = new Array(W*H).fill(null);
    const ox = Math.floor((W-32)/2), oy = Math.floor((H-32)/2);
    for (let y=0;y<32;y++) for (let x=0;x<32;x++){
      const dx = x+ox, dy = y+oy;
      if (dx>=0 && dx<W && dy>=0 && dy<H) out[dy*W+dx] = buf[y*32+x];
    }
    return out;
  }

  componentDidMount(){
    if (this.props.accent) document.documentElement.style.setProperty('--gold', this.props.accent);
    this.onKey = e => this.key(e);
    window.addEventListener('keydown', this.onKey);
    this.onResize = () => this.fit();
    window.addEventListener('resize', this.onResize);
    requestAnimationFrame(() => requestAnimationFrame(() => this.fit()));
    const box = this.mainRef.current && this.mainRef.current.closest('main');
    if (box && window.ResizeObserver){ this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(box); }
    try {
      const raw = localStorage.getItem(AUTO_KEY);
      if (raw){
        const d = JSON.parse(raw);
        if (d && d.frames && d.frames.length) this.setState({ pending:d, restore:{ name:d.name || 'untitled', at:d.at || Date.now() } });
      }
    } catch(err){}
    this.tick = setInterval(() => { if (this.state.autoAt || this.state.savedAt) this.forceUpdate(); }, 15000);
    this.beforeUnload = e => { if (this.state.dirty){ this.autosave(); } };
    window.addEventListener('beforeunload', this.beforeUnload);
    this.paint();
  }
  componentWillUnmount(){
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('beforeunload', this.beforeUnload);
    if (this.ro) this.ro.disconnect();
    clearTimeout(this.timer); clearTimeout(this.autoTimer); clearInterval(this.tick);
  }
  componentDidUpdate(){ if (this.autoFit !== false) this.fit(); this.paint(); }

  fit(){
    const cv = this.mainRef.current;
    const box = cv && cv.closest('main');
    if (!box) return;
    const bw = box.clientWidth, bh = box.clientHeight;
    if (bw < 40 || bh < 40) return;
    const reps = this.state.tile ? 3 : 1;
    const d = this.dims();
    const cell = Math.max(2, Math.min(40, Math.floor(Math.min(
      (bw - 52) / (d.w * reps),
      (bh - 52) / (d.h * reps)
    ))));
    if (cell !== this.state.cell) this.setState({cell});
  }

  /* ── canvas painting ── */
  blit(c, px, W, H, cell, ox, oy, alpha, tint){
    if (alpha != null) c.globalAlpha = alpha;
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const v = px[y*W+x];
      if (!v) continue;
      c.fillStyle = tint ? mix(v, tint, .45) : v;
      c.fillRect(ox + x*cell, oy + y*cell, cell, cell);
    }
    c.globalAlpha = 1;
  }

  draw(cv, px, W, H, cell, grid, checker){
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const pw = W*cell, ph = H*cell;
    cv.width = pw*dpr; cv.height = ph*dpr;
    cv.style.width = pw+'px'; cv.style.height = ph+'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,pw,ph);
    if (checker){
      const q = Math.max(4, cell);
      for (let y=0;y<ph;y+=q) for (let x=0;x<pw;x+=q){
        c.fillStyle = ((x/q + y/q) % 2 === 0) ? '#242019' : '#1b1814';
        c.fillRect(x,y,q,q);
      }
    }
    this.blit(c, px, W, H, cell, 0, 0, null, null);
    if (grid && cell >= 7) this.gridLines(c, W, H, cell, 0, 0);
  }

  /* Preview canvases keep a native-resolution backing store and are fitted
     independently in CSS. Unlike the editor zoom, this intentionally permits
     fractional display scaling for sprites larger than their preview box. */
  drawPreview(cv, px, W, H, box){
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const backingW = Math.max(1, Math.round(W * dpr));
    const backingH = Math.max(1, Math.round(H * dpr));
    const fitted = PixelStudioPreview.fitDimensions(box, W, H);
    cv.width = backingW; cv.height = backingH;
    cv.style.width = fitted.width + 'px'; cv.style.height = fitted.height + 'px';
    const c = cv.getContext('2d');
    c.setTransform(backingW / W, 0, 0, backingH / H, 0, 0);
    c.clearRect(0, 0, W, H);
    this.blit(c, px, W, H, 1, 0, 0, null, null);

  gridLines(c, W, H, cell, ox, oy){
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(236,231,222,.08)';
    c.beginPath();
    for (let i=1;i<W;i++){ c.moveTo(ox+i*cell+.5,oy); c.lineTo(ox+i*cell+.5,oy+H*cell); }
    for (let i=1;i<H;i++){ c.moveTo(ox,oy+i*cell+.5); c.lineTo(ox+W*cell,oy+i*cell+.5); }
    c.stroke();
    c.strokeStyle = 'rgba(225,173,102,.2)';
    c.beginPath();
    for (let i=8;i<W;i+=8){ c.moveTo(ox+i*cell+.5,oy); c.lineTo(ox+i*cell+.5,oy+H*cell); }
    for (let i=8;i<H;i+=8){ c.moveTo(ox,oy+i*cell+.5); c.lineTo(ox+W*cell,oy+i*cell+.5); }

  drawReference(c, ox, oy, aw, ah){

    if (!iw || !ih) return;

    const dw = iw*sc, dh = ih*sc;
    const dx = ox + (aw-dw)/2 + (s.refX||0), dy = oy + (ah-dh)/2 + (s.refY||0);
    c.save();
    c.globalAlpha = Math.max(0, Math.min(1, s.refOpacity/100));
    c.imageSmoothingEnabled = true;
    c.drawImage(this.refImg, dx, dy, dw, dh);
    c.restore();
  }

  paintMain(){
    const cv = this.mainRef.current;

    const reps = s.tile ? 3 : 1;

    const dpr = Math.min(2, window.devicePixelRatio || 1);

    cv.style.width = cw+'px'; cv.style.height = ch+'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,cw,ch);

    const q = Math.max(4, cell);
    for (let y=0;y<ch;y+=q) for (let x=0;x<cw;x+=q){
      c.fillStyle = ((x/q + y/q) % 2 === 0) ? '#242019' : '#1b1814';
      c.fillRect(x,y,q,q);
    }

    if (s.workspace === 'atlas' && !s.atlas.length) return;

    if (s.workspace !== 'tiles') this.drawReference(c, offx, offy, W*cell, H*cell);

    const px = this.curPx();
    for (let ty=0;ty<reps;ty++) for (let tx=0;tx<reps;tx++){
      const centre = !s.tile || (tx===1 && ty===1);
      const ox = tx*W*cell, oy = ty*H*cell;
      if (centre && s.onion.on && s.workspace === 'frames') this.paintOnion(c, ox, oy);
      this.blit(c, px, W, H, cell, ox, oy, centre ? 1 : (s.workspace === 'tiles' ? .82 : .4), null);
    }

      c.fillStyle = 'rgba(21,19,15,.32)';

      c.restore();
    }

      const r = s.selRect;
      c.save();
      c.lineWidth = 1;
      c.strokeStyle = 'rgba(21,19,15,.85)';
      c.strokeRect(offx+r.x*cell+.5, offy+r.y*cell+.5, r.w*cell-1, r.h*cell-1);
      c.setLineDash([4,3]);
      c.strokeStyle = '#e1ad66';
      c.strokeRect(offx+r.x*cell+.5, offy+r.y*cell+.5, r.w*cell-1, r.h*cell-1);
      c.restore();
    }
  }

  paintOnion(c, ox, oy){
    const s = this.state, W = s.w, H = s.h, cell = s.cell, o = s.onion;
    const n = s.frames.length;
    for (let k=o.prev;k>=1;k--){

      if (i < 0) continue;
      this.blit(c, s.frames[i].px, W, H, cell, ox, oy, (o.opacity/100)/k, ONION_PREV);
    }
    for (let k=o.next;k>=1;k--){
      const i = s.active + k;
      if (i >= n) continue;
      this.blit(c, s.frames[i].px, W, H, cell, ox, oy, (o.opacity/100)/k, ONION_NEXT);
    }
  }

  paint(){
    const s = this.state;
    const { frames, active, playing, previewIdx } = s;
    this.paintMain();
    if (s.workspace === 'tiles'){
      this.paintTileRepeat();
      s.tiles.forEach(t => { const el = this.thumbs[t.id]; if (el) this.drawPreview(el, t.px, s.w, s.h, 66); });
    } else if (s.workspace === 'atlas'){
      const a = s.atlas[s.activeAtlas];
      if (a) this.drawPreview(this.previewRef.current, a.px, a.w, a.h, 88);
      else { const cv = this.previewRef.current; if (cv){ cv.width = cv.height = 1; cv.style.width = cv.style.height = '0px'; } }
      s.atlas.forEach(it => { const el = this.thumbs[it.id]; if (el) this.drawPreview(el, it.px, it.w, it.h, 66); });
    } else {
      const pf = frames[(playing ? previewIdx : active) % frames.length];
      this.drawPreview(this.previewRef.current, pf.px, s.w, s.h, 88);
      frames.forEach(f => { const el = this.thumbs[f.id]; if (el) this.drawPreview(el, f.px, s.w, s.h, 66); });
    }
    if (s.tfx != null && frames[s.tfx]) this.drawPreview(this.tfxRef.current, frames[s.tfx].px, s.w, s.h, 96);
    if (s.sheetOpen) this.paintSheet();
    if (s.tileSheetOpen) this.paintTileSheet();
    if (s.atlasSheetOpen) this.paintAtlasSheet();
  }

  /* ── sprite sheet ── */
  sheetGeom(){
    const { w:fw, h:fh, layout, cols, spacing, padding } = this.state;
    const list = this.sheetList();
    const n = Math.max(1, list.length);
    const c = layout==='horizontal' ? n : layout==='vertical' ? 1 : Math.max(1, Math.min(cols, n));
    const r = Math.ceil(n / c);
    return { list, c, r, fw, fh, w: padding*2 + c*fw + (c-1)*spacing, h: padding*2 + r*fh + (r-1)*spacing };
  }
  sheetList(){
    const s = this.state;
    if (s.exportScope === 'selected'){ const l = s.frames.filter(f=>f.sel); return l.length ? l : s.frames; }
    if (s.exportScope === 'anim'){
      const t = this.activeTagObj();
      if (t){ const l = s.frames.slice(Math.max(0,t.start-1), t.end); if (l.length) return l; }
    }
    return s.frames;
  }
  paintSheet(){
    const cv = this.sheetRef.current;
    if (!cv) return;
    const { w:fw, h:fh, spacing, padding, transparent, showCells } = this.state;
    const g = this.sheetGeom();
    const scale = Math.max(1, Math.floor(Math.min(470/g.w, 260/g.h)));
    cv.width = g.w*scale; cv.height = g.h*scale;
    cv.style.width = (g.w*scale)+'px'; cv.style.height = (g.h*scale)+'px';
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.clearRect(0,0,cv.width,cv.height);
    if (!transparent){ c.fillStyle = '#15130f'; c.fillRect(0,0,cv.width,cv.height); }
    else if (showCells){
      const q = 8*scale;
      for (let y=0;y<cv.height;y+=q) for (let x=0;x<cv.width;x+=q){
        c.fillStyle = ((x/q + y/q)%2===0) ? '#242019' : '#1b1814';
        c.fillRect(x,y,q,q);
      }
    }
    g.list.forEach((f, i) => {
      const ox = (padding + (i%g.c)*(fw+spacing))*scale, oy = (padding + Math.floor(i/g.c)*(fh+spacing))*scale;
      this.blit(c, f.px, fw, fh, scale, ox, oy, null, null);
      if (showCells){ c.strokeStyle = 'rgba(225,173,102,.35)'; c.lineWidth = 1; c.strokeRect(ox+.5, oy+.5, fw*scale-1, fh*scale-1); }
    });
  }

  /* ── history ── */
  snap(){

  cap(){ return { frames:this.state.frames.map(f=>({...f, px:f.px.slice()})), tiles:this.state.tiles.map(t=>({...t, px:t.px.slice()})), atlas:this.state.atlas.map(a=>({...a, px:a.px.slice()})), activeTile:this.state.activeTile, activeAtlas:this.state.activeAtlas, active:this.state.active, w:this.state.w, h:this.state.h, selRect:this.state.selRect }; }

  redo(){ if (!this.redoStack.length) return; this.undoStack.push(this.cap()); this.setState(this.redoStack.pop()); }

  /* ── pixel helpers ── */
  cellAt(e){
    const cv = this.mainRef.current;
    const r = cv.getBoundingClientRect();
    const { cell, tile, wrap } = this.state;
    const d = this.dims(), W = d.w, H = d.h;
    const offx = tile ? W*cell : 0, offy = tile ? H*cell : 0;
    let x = Math.floor((e.clientX - r.left - offx)/cell), y = Math.floor((e.clientY - r.top - offy)/cell);

  }
  mirrorPts(x,y){
    const { mirrorH, mirrorV } = this.state;
    const d = this.dims(), W = d.w, H = d.h;

    if (mirrorV) pts.push([x, H-1-y]);

    return pts.filter(([a,b]) => { const k=a+':'+b; if (seen.has(k)) return false; seen.add(k); return true; });
  }
  rampStep(col, dir){

        if (i >= 0) return r.colors[Math.max(0, Math.min(r.colors.length-1, i+dir))];

  }
  grab(px, r){
    const d = this.dims(), W = d.w, H = d.h, out = new Array(r.w*r.h).fill(null);
    for (let y=0;y<r.h;y++) for (let x=0;x<r.w;x++){
      const sx = r.x+x, sy = r.y+y;
      if (sx>=0 && sx<W && sy>=0 && sy<H) out[y*r.w+x] = px[sy*W+sx];

  }
  put(px, r, buf){
    const d = this.dims(), W = d.w, H = d.h;
    for (let y=0;y<r.h;y++) for (let x=0;x<r.w;x++){
      const dx = r.x+x, dy = r.y+y;
      if (dx>=0 && dx<W && dy>=0 && dy<H) px[dy*W+dx] = buf[y*r.w+x];

  }
  clearRegion(px, r){
    const d = this.dims(), W = d.w, H = d.h;
    for (let y=0;y<r.h;y++) for (let x=0;x<r.w;x++){
      const dx = r.x+x, dy = r.y+y;
      if (dx>=0 && dx<W && dy>=0 && dy<H) px[dy*W+dx] = null;
    }
  }
  curPx(){
    const s = this.state;
    if (s.workspace === 'tiles'){ const t = s.tiles[s.activeTile]; return t ? t.px : s.frames[s.active].px; }
    if (s.workspace === 'atlas'){ const a = s.atlas[s.activeAtlas]; return a ? a.px : s.frames[s.active].px; }
    return s.frames[s.active].px;
  }
  /* dimensions of the surface currently being edited (atlas sprites carry their own) */
  dims(){
    const s = this.state;
    if (s.workspace === 'atlas'){ const a = s.atlas[s.activeAtlas]; if (a) return { w:a.w, h:a.h }; }

  touch(){ this.forceUpdate(); this.markDirty(); }

  /* ── drawing ── */
  applyOne(x, y){

    else if (tool==='picker'){ if (px[i]) this.pickColor(px[i]); }
    else if (tool==='fill') this.flood(px, W, d.h, x, y, fg);
    else if (tool==='lighten' || tool==='darken'){

  apply(x,y){

  flood(px, W, H, x, y, col){

      const [cx,cy] = st.pop();

      const i = cy*W+cx;

  pickColor(c){ this.setState({fg:c}); this.pushRecent(c); }
  pushRecent(c){
    this.setState(s => {

  move(e){

    }

    if (p && (!this.state.hover || this.state.hover.x!==p.x || this.state.hover.y!==p.y)) this.setState({hover:p});
    if (!this.drawing || !p) return;

      if (this.selMode === 'new'){
        const a = this.selAnchor;
        this.setState({selRect:{ x:Math.min(a.x,p.x), y:Math.min(a.y,p.y), w:Math.abs(p.x-a.x)+1, h:Math.abs(p.y-a.y)+1 }});

        const px = this.curPx();

  /* ── shape tools (rectangle / ellipse) ── */
  drawShape(a, b, e){

    const fill = this.state.shapeFill || !!(e && e.altKey);
    if (this.state.tool === 'rect'){
      if (fill){ for (let y=ty;y<=by;y++) for (let x=lx;x<=rx;x++) plot(x,y); }
      else { for (let x=lx;x<=rx;x++){ plot(x,ty); plot(x,by); } for (let y=ty;y<=by;y++){ plot(lx,y); plot(rx,y); } }
    } else {
      if (fill){
        const cx=(lx+rx+1)/2, cy=(ty+by+1)/2, arx=Math.max(0.5,(rx-lx+1)/2), ary=Math.max(0.5,(by-ty+1)/2);
        for (let y=ty;y<=by;y++) for (let x=lx;x<=rx;x++){ const nx=(x+0.5-cx)/arx, ny=(y+0.5-cy)/ary; if (nx*nx+ny*ny<=1) plot(x,y); }
      } else if (rx===lx || by===ty){
        for (let x=lx;x<=rx;x++){ plot(x,ty); plot(x,by); } for (let y=ty;y<=by;y++){ plot(lx,y); plot(rx,y); }
      } else {
        this.plotEllipseRect(lx,ty,rx,by, plot);
      }
    }
  }
  plotEllipseRect(x0,y0,x1,y1, plot){
    let a=Math.abs(x1-x0), b=Math.abs(y1-y0), b1=b&1;
    let dx=4*(1-a)*b*b, dy=4*(b1+1)*a*a;
    let err=dx+dy+b1*a*a, e2;
    if (x0>x1){ x0=x1; x1+=a; }
    if (y0>y1){ y0=y1; }
    y0 += Math.floor((b+1)/2); y1=y0-b1;
    a=8*a*a; b1=8*b*b;
    do {
      plot(x1,y0); plot(x0,y0); plot(x0,y1); plot(x1,y1);
      e2=2*err;
      if (e2<=dy){ y0++; y1--; err+=dy+=a; }
      if (e2>=dx || 2*err>dy){ x0++; x1--; err+=dx+=b1; }
    } while (x0<=x1);
    while (y0-y1 < b){ plot(x0-1,y0); plot(x1+1,y0++); plot(x0-1,y1); plot(x1+1,y1--); }
  }

  /* ── selection actions ── */
  selCopy(){
    const r = this.state.selRect; if (!r) return;
    this.setState({ clip:{ w:r.w, h:r.h, buf:this.grab(this.curPx(), r) }, hint:'Copied '+r.w+'×'+r.h+' px' });
  }
  selCut(){
    const r = this.state.selRect; if (!r) return;
    this.snap();
    const buf = this.grab(this.curPx(), r);
    this.clearRegion(this.curPx(), r);
    this.setState({ clip:{w:r.w, h:r.h, buf}, hint:'Cut '+r.w+'×'+r.h+' px' });
  }
  selPaste(){
    const cl = this.state.clip; if (!cl) return;
    this.snap();
    const r = this.state.selRect || {x:0,y:0};
    const rect = { x:r.x, y:r.y, w:cl.w, h:cl.h };
    this.put(this.curPx(), rect, cl.buf);
    this.setState({ selRect:rect, hint:'Pasted at '+rect.x+', '+rect.y });
  }
  selDelete(){
    const r = this.state.selRect; if (!r) return;
    this.snap();
    this.clearRegion(this.curPx(), r);
    this.setState({hint:'Cleared selection'});
  }
  selTransform(kind){
    const r = this.state.selRect; if (!r) return;
    this.snap();
    const buf = this.grab(this.curPx(), r);
    let out = buf, rect = r;
    if (kind==='flipH'){ out = new Array(r.w*r.h).fill(null); for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++) out[y*r.w+x]=buf[y*r.w+(r.w-1-x)]; }
    else if (kind==='flipV'){ out = new Array(r.w*r.h).fill(null); for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++) out[y*r.w+x]=buf[(r.h-1-y)*r.w+x]; }
    else if (kind==='rot'){
      out = new Array(r.w*r.h).fill(null);
      for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++) out[x*r.h+(r.h-1-y)] = buf[y*r.w+x];
      rect = { x:r.x, y:r.y, w:r.h, h:r.w };
    }
    const px = this.curPx();
    this.clearRegion(px, r);
    this.put(px, rect, out);
    this.setState({selRect:rect});
  }
  nudge(dx,dy){
    const r = this.state.selRect; if (!r) return;
    this.snap();
    const px = this.curPx();
    const buf = this.grab(px, r);
    this.clearRegion(px, r);
    const rect = { x:r.x+dx, y:r.y+dy, w:r.w, h:r.h };
    this.put(px, rect, buf);
    this.setState({selRect:rect, hint:'Nudged selection'});
  }

  /* ── frame transforms ── */
  transformFrame(i, kind){
    this.snap();
    this.setState(s => {
      const W = s.w, H = s.h, src = s.frames[i].px, out = new Array(W*H).fill(null);
      for (let y=0;y<H;y++) for (let x=0;x<W;x++){
        const v = src[y*W+x];
        let tx = x, ty = y;
        if (kind==='flipH') tx = W-1-x;
        else if (kind==='flipV') ty = H-1-y;
        else if (kind==='rot'){ tx = H-1-y; ty = x; }
        else if (kind==='left') tx = x-1;
        else if (kind==='right') tx = x+1;
        else if (kind==='up') ty = y-1;
        else if (kind==='down') ty = y+1;
        if (tx<0||tx>=W||ty<0||ty>=H) continue;
        out[ty*W+tx] = v;
      }
      const frames = s.frames.slice();
      frames[i] = {...frames[i], px:out};
      return { frames };
    });
  }

  key(e){
    const t = e.target;
    if (t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA')) return;
    const mod = e.metaKey || e.ctrlKey;
    const k = e.key.toLowerCase();
    if (mod){
      if (k==='s'){ e.preventDefault(); this.saveProject(e.shiftKey); return; }
      if (k==='o'){ e.preventDefault(); if (this.projRef.current) this.projRef.current.click(); return; }
      if (k==='z'){ e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); return; }
      if (k==='y'){ e.preventDefault(); this.redo(); return; }
      if (k==='c'){ e.preventDefault(); this.selCopy(); return; }
      if (k==='x'){ e.preventDefault(); this.selCut(); return; }
      if (k==='v'){ e.preventDefault(); this.selPaste(); return; }
      return;
    }
    if (k===' '){ e.preventDefault(); this.play(); return; }
    if (k==='escape'){ this.setState({selRect:null, menu:null, tfx:null, tagEdit:null, saveAs:null, newOpen:false, tileSheetOpen:false, atlasSheetOpen:false}); return; }
    if ((k==='delete' || k==='backspace') && this.state.selRect){ e.preventDefault(); this.selDelete(); return; }
    if (k.startsWith('arrow')){
      const d = { arrowleft:[-1,0], arrowright:[1,0], arrowup:[0,-1], arrowdown:[0,1] }[k];
      if (this.state.selRect){ e.preventDefault(); this.nudge(d[0], d[1]); return; }
      if (k==='arrowright') this.setState(s=>({active:(s.active+1)%s.frames.length}));
      if (k==='arrowleft') this.setState(s=>({active:(s.active-1+s.frames.length)%s.frames.length}));
      return;
    }
    const map = { p:'pencil', e:'eraser', i:'picker', f:'fill', r:'rect', c:'ellipse', l:'lighten', d:'darken', x:'tint', m:'move', s:'select' };
    if (map[k]){ const tl = TOOLS.find(x=>x.id===map[k]); this.setState({tool:map[k], hint:tl.hint||tl.name}); }
    else if (k==='g') this.setState(v=>({grid:!v.grid}));
    else if (k==='t') this.setState(v=>({tile:!v.tile}), ()=>this.fit());
    else if (k==='w') this.setState(v=>({wrap:!v.wrap, hint:v.wrap?'Wrap drawing off':'Wrap drawing on — paint past an edge and it wraps'}));
    else if (k==='o') this.setState(v=>({onion:{...v.onion, on:!v.onion.on}}));
    else if (k==='h') this.setState(v=>({mirrorH:!v.mirrorH}));
    else if (k==='v') this.setState(v=>({mirrorV:!v.mirrorV}));
  }

  /* ── frames ── */
  addFrame(){
    this.snap();
    this.setState(s => {
      const frames = s.frames.slice();
      frames.splice(s.active+1, 0, { id:'f'+Date.now(), px:new Array(s.w*s.h).fill(null), sel:true, dur:s.frames[s.active].dur });
      return { frames, active:s.active+1 };
    });
  }
  dupFrame(at, then){
    this.snap();
    this.setState(s => {
      const i = at == null ? s.active : at;
      const src = s.frames[i];
      const frames = s.frames.slice();
      frames.splice(i+1, 0, { id:'f'+Date.now(), px:src.px.slice(), sel:true, dur:src.dur });
      return { frames, active:i+1 };
    }, then);
  }
  delFrame(at){
    if (this.state.frames.length <= 1) return;
    this.snap();
    this.setState(s => {
      const i = at == null ? s.active : at;
      return { frames:s.frames.filter((_,j)=>j!==i), active:Math.max(0, Math.min(s.frames.length-2, i>0?i-1:0)) };
    });
  }
  reorder(from, to){
    if (from===to) return;
    this.snap();
    this.setState(s => {
      const frames = s.frames.slice();
      const [m] = frames.splice(from,1);
      frames.splice(to,0,m);
      return { frames, active:to };
    });
  }
  setDur(i, ms){
    const v = Math.max(20, Math.min(2000, Math.round(ms/10)*10));
    this.setState(s => { const frames = s.frames.slice(); frames[i] = {...frames[i], dur:v}; return { frames }; }, () => this.markDirty());
  }

  setDims(nw, nh){
    nw = Math.max(1, Math.min(256, Math.round(nw) || 0));
    nh = Math.max(1, Math.min(256, Math.round(nh) || 0));
    if (!nw || !nh || (nw === this.state.w && nh === this.state.h)) return;
    this.snap();
    this.setState(s => {
      const remap = px => {
        const out = new Array(nw*nh).fill(null);
        const ox = Math.floor((nw - s.w)/2), oy = Math.floor((nh - s.h)/2);
        for (let y=0;y<s.h;y++) for (let x=0;x<s.w;x++){
          const dx = x+ox, dy = y+oy;
          if (dx>=0 && dx<nw && dy>=0 && dy<nh) out[dy*nw+dx] = px[y*s.w+x];
        }
        return out;
      };
      return {
        w:nw, h:nh, selRect:null,
        frames: s.frames.map(f => ({...f, px:remap(f.px)})),
        tiles: s.tiles.map(t => ({...t, px:remap(t.px)})),
        hint:'Canvas ' + nw + ' × ' + nh
      };
    }, () => this.fit());
  }
  setSize(n){ this.setDims(n, n); }

  /* ── playback on per-frame durations ── */
  play(){
    clearTimeout(this.timer);
    if (this.state.playing){ this.setState({playing:false}); return; }
    if (this.state.workspace === 'tiles'){ this.setState({hint:'Playback is for animation frames — switch to Frames'}); return; }
    const r = this.range();
    this.dir = r.mode === 'Reverse' ? -1 : 1;
    const start = r.mode === 'Reverse' ? r.b : r.a;
    this.setState({ playing:true, previewIdx:start }, () => this.schedule());
  }
  schedule(){
    if (!this.state.playing) return;
    const f = this.state.frames[this.state.previewIdx] || this.state.frames[0];
    this.timer = setTimeout(() => {
      if (!this.state.playing) return;
      const r = this.range();
      this.setState(s => {
        let i = s.previewIdx + this.dir;
        if (r.mode === 'Ping Pong'){
          if (i > r.b){ this.dir = -1; i = Math.max(r.a, r.b-1); }
          else if (i < r.a){ this.dir = 1; i = Math.min(r.b, r.a+1); }
        } else if (r.mode === 'Reverse'){ if (i < r.a) i = r.b; }
        else if (i > r.b) i = r.a;
        return { previewIdx:i };
      }, () => this.schedule());
    }, Math.max(20, f.dur || 100));
  }

  dl(cv, name){
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png'); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  exportPng(){
    const { w:W, h:H, frames, active } = this.state;
    const cv = document.createElement('canvas');
    this.draw(cv, frames[active].px, W, H, 8, false, false);
    this.dl(cv, 'sprite-frame-'+(active+1)+'.png');
    this.setState({hint:'Exported frame '+(active+1)+' as PNG'});
  }
  exportSheet(){
    const cv = document.createElement('canvas');
    const g = this.sheetGeom();
    const { w:fw, h:fh, spacing, padding, transparent } = this.state;
    cv.width = g.w; cv.height = g.h;
    const c = cv.getContext('2d');
    if (!transparent){ c.fillStyle='#15130f'; c.fillRect(0,0,g.w,g.h); }
    g.list.forEach((f,i)=>{
      const ox = padding + (i%g.c)*(fw+spacing), oy = padding + Math.floor(i/g.c)*(fh+spacing);
      this.blit(c, f.px, fw, fh, 1, ox, oy, null, null);
    });
    this.dl(cv, 'sprite-sheet-'+g.w+'x'+g.h+'.png');
    this.setState({hint:'Exported sheet '+g.w+'×'+g.h});
  }
  onImport(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const { w:W, h:H } = this.state;
      const tmp = document.createElement('canvas');
      tmp.width = W; tmp.height = H;
      const c = tmp.getContext('2d');
      c.imageSmoothingEnabled = false;
      c.drawImage(img, 0, 0, W, H);
      const d = c.getImageData(0,0,W,H).data;
      this.snap();
      this.setState(s => {
        const frames = s.frames.slice();
        const px = new Array(W*H).fill(null);
        for (let i=0;i<W*H;i++){ if (d[i*4+3] > 24) px[i] = rgb2hex(d[i*4], d[i*4+1], d[i*4+2]); }
        frames[s.active] = {...frames[s.active], px};
        return { frames, hint:'Imported '+file.name };
      });
    };
    img.src = URL.createObjectURL(file);
    e.target.value = '';
  }

  /* ── reference image (trace-over layer) ── */
  loadRefImage(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { this.refImg = img; this.setState({ ref:url, refOn:true, refX:0, refY:0, hint:'Reference loaded — set opacity/scale, then trace' }); };
    img.onerror = () => this.setState({ hint:'Could not load that image' });
    img.src = url;
  }
  clearRefImage(){
    if (this.state.ref){ try { URL.revokeObjectURL(this.state.ref); } catch(err){} }
    this.refImg = null;
    this.setState({ ref:null, refMove:false, hint:'Reference cleared' });
  }

  /* ── demo content ── */
  demoFrames(W, H){
    const durs = [180,180,200,180, 90,90,100,90, 70,60,120,200];
    return durs.map((d,i) => ({ id:'f'+i, px:this.demoPx(i,W,H), sel:true, dur:d }));
  }
  demoPx(i, W, H){
    const base = this.sprite(i%4, W, H);
    const dx = i>=4 && i<8 ? [-1,0,1,0][i-4] : 0;
    const dy = i>=8 ? [1,2,0,-1][i-8] : 0;
    if (!dx && !dy) return base;
    const out = new Array(W*H).fill(null);
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const sx=x-dx, sy=y-dy;
      if (sx>=0&&sx<W&&sy>=0&&sy<H) out[y*W+x] = base[sy*W+sx];
    }
    return out;
  }
  demoTiles(W, H){
    return ['Grass','Dirt','Water','Stone','Path'].map((n,i) => ({ id:'t'+i, name:n, px:this.tilePx(n.toLowerCase(), W, H) }));
  }
  tilePx(kind, W, H){
    const P = {
      grass:['#3f6b45','#7fbf6a','#2c4a31'], dirt:['#6b4f3a','#a8763f','#3b2f2a'],
      water:['#2f5670','#6fb0c9','#1b2c3a'], stone:['#3b3a36','#6a6862','#26251f'],
      path:['#a8763f','#e1ad66','#6b4f3a']
    }[kind] || ['#3b2f2a','#a8763f','#15130f'];
    const px = new Array(W*H).fill(P[0]);
    const rnd = (x,y) => { const v = Math.sin(x*12.9898 + y*78.233) * 43758.5453; return v - Math.floor(v); };
    const q = Math.max(4, Math.round(Math.min(W,H)/4));
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const r = rnd(x,y);
      let c = r > .84 ? P[1] : r < .16 ? P[2] : P[0];
      if (kind==='water'){ const band = Math.sin((y/H)*Math.PI*2 + x*.18) > .55; c = band ? P[1] : (r<.1 ? P[2] : P[0]); }
      if (kind==='stone' || kind==='path'){ if (x % q === 0 || y % q === 0) c = P[2]; else if ((x+y) % q === 1) c = P[1]; }
      px[y*W+x] = c;
    }
    return px;
  }

  /* ── project format ── */
  serialize(){
    const s = this.state;
    return {
      format:'pixelproj', version:1, name:s.projectName, w:s.w, h:s.h,
      frames:s.frames.map(f=>({ id:f.id, px:f.px, sel:f.sel, dur:f.dur })),
      tags:s.tags, activeTag:s.activeTag,
      palette:s.palette, ramps:s.ramps, recent:s.recent, shadeMode:s.shadeMode,
      mirror:{ h:s.mirrorH, v:s.mirrorV },
      tileSettings:{ on:s.tile, wrap:s.wrap, preview:s.tilePreview },
      onion:s.onion,
      sheet:{ layout:s.layout, cols:s.cols, spacing:s.spacing, padding:s.padding, transparent:s.transparent, scope:s.exportScope },
      tiles:s.tiles.map(t=>({ id:t.id, name:t.name, px:t.px, kind:t.kind, corners:t.corners, collision:t.collision, tags:t.tags })),
      terrains:s.terrains,
      atlas:s.atlas.map(a=>({ id:a.id, name:a.name, w:a.w, h:a.h, px:a.px, kind:a.kind, collision:a.collision, tags:a.tags })), atlasExport:s.atlasExport, activeAtlas:s.activeAtlas,
      activeTile:s.activeTile, tileExport:s.tileExport, workspace:s.workspace
    };
  }
  loadProject(d, named){
    const w = d.w != null ? d.w : (d.size || 32);
    const h = d.h != null ? d.h : (d.size || 32);
    const ts = d.tileSettings || {};
    const sh = d.sheet || {};
    this.undoStack = []; this.redoStack = [];
    this.setState({
      projectName: d.name || 'untitled', named:!!named, dirty:false, savedAt: named ? Date.now() : null,
      w, h,
      frames: (d.frames && d.frames.length) ? d.frames.map((f,i)=>({ id:f.id||'f'+i, px:f.px||new Array(w*h).fill(null), sel:f.sel!==false, dur:f.dur||120 })) : this.demoFrames(w,h),
      active:0,
      tags: d.tags || [], activeTag: d.activeTag || null,
      palette: d.palette || PALETTE.slice(),
      ramps: d.ramps || RAMPS.map(r=>({...r, colors:r.colors.slice()})),
      recent: d.recent || [], shadeMode: d.shadeMode || 'ramp',
      mirrorH: !!(d.mirror && d.mirror.h), mirrorV: !!(d.mirror && d.mirror.v),
      tile: !!ts.on, wrap: !!ts.wrap, tilePreview: ts.preview || 3,
      onion: d.onion || { on:false, prev:1, next:1, opacity:35 },
      layout: sh.layout || 'grid', cols: sh.cols || 4,
      spacing: sh.spacing == null ? 2 : sh.spacing, padding: sh.padding == null ? 4 : sh.padding,
      transparent: sh.transparent !== false, exportScope: sh.scope || 'all',
      tiles: (d.tiles && d.tiles.length) ? d.tiles : this.demoTiles(w,h),
      terrains: d.terrains || [], terrainDraft:'',
      atlas: d.atlas || [],
      activeAtlas: d.activeAtlas || 0,
      atlasExport: d.atlasExport || { spacing:1, padding:1, transparent:true },
      atlasSheetOpen:false,
      activeTile: d.activeTile || 0,
      tileExport: d.tileExport || { layout:'grid', cols:4, spacing:0, padding:0, transparent:true },
      workspace: d.workspace || 'frames',
      selRect:null, clip:null, playing:false, restore:null, pending:null, menu:null, tfx:null,
      hint:'Opened ' + (d.name || 'project') + '.pixelproj'
    }, () => this.fit());
  }
  writeProject(name){
    const clean = (name||'untitled').trim().replace(/\.pixelproj$/i,'') || 'untitled';
    const blob = new Blob([JSON.stringify({...this.serialize(), name:clean})], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = clean + '.pixelproj';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    this.setState({ projectName:clean, named:true, dirty:false, savedAt:Date.now(), saveAs:null, hint:'Saved ' + clean + '.pixelproj' });
  }
  saveProject(forceAs){
    if (forceAs || !this.state.named){ this.setState({ saveAs:{ name:this.state.projectName }, menu:null }); return; }
    this.writeProject(this.state.projectName);
  }
  onOpenProject(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || !d.frames) throw new Error('bad');
        this.loadProject(d, true);
        this.setState({ projectName:(d.name || file.name.replace(/\.pixelproj$/i,'')) });
      } catch(err){ this.setState({ hint:'Could not read ' + file.name + ' — not a project file' }); }
    };
    rd.readAsText(file);
  }
  createProject(){
    const s = this.state;
    const nw = Math.max(1, Math.min(256, parseInt(s.npW,10) || 32));
    const nh = Math.max(1, Math.min(256, parseInt(s.npH,10) || 32));
    this.undoStack = []; this.redoStack = [];
    this.setState({
      projectName:(s.npName||'untitled').trim() || 'untitled', named:false, dirty:true, savedAt:null,
      w:nw, h:nh, frames:[{ id:'f'+Date.now(), px:new Array(nw*nh).fill(null), sel:true, dur:120 }], active:0,
      tags:[], activeTag:null, tiles:[{ id:'tl'+Date.now(), name:'Tile 1', px:new Array(nw*nh).fill(s.npTransparent ? null : s.bg) }],
      atlas:[], activeAtlas:0, atlasSheetOpen:false,
      activeTile:0, workspace:'frames', selRect:null, clip:null, playing:false, newOpen:false,
      transparent:!!s.npTransparent, restore:null,
      hint:'New project — ' + nw + '×' + nh
    }, () => { this.fit(); this.markDirty(); });
  }

  /* ── autosave ── */
  markDirty(){
    clearTimeout(this.autoTimer);
    if (!this.state.dirty || this.state.autoState !== 'pending') this.setState({ dirty:true, autoState:'pending' });
    this.autoTimer = setTimeout(() => this.autosave(), 900);
  }
  autosave(){
    this.setState({ autoState:'saving' });
    try {
      localStorage.setItem(AUTO_KEY, JSON.stringify({ ...this.serialize(), at:Date.now(), named:this.state.named }));
      setTimeout(() => this.setState({ autoState:'saved', autoAt:Date.now() }), 220);
    } catch(err){ this.setState({ autoState:'error' }); }
  }
  ago(t){
    if (!t) return '';
    const d = Math.max(0, Math.round((Date.now()-t)/1000));
    if (d < 10) return 'just now';
    if (d < 60) return d + ' sec ago';
    if (d < 3600) return Math.round(d/60) + ' min ago';
    return Math.round(d/3600) + ' hr ago';
  }
  autoText(){
    const s = this.state;
    if (s.autoState === 'saving') return 'Saving…';
    if (s.autoState === 'pending') return 'Unsaved changes';
    if (s.autoState === 'error') return 'Local storage full';
    if (s.autoState === 'saved') return 'Saved locally · ' + this.ago(s.autoAt);
    return 'Autosave ready';
  }

  /* ── animation tags ── */
  activeTagObj(){ return this.state.tags.find(t => t.id === this.state.activeTag) || null; }
  range(){
    const s = this.state, n = s.frames.length, t = this.activeTagObj();
    if (t) return { a:Math.max(0,Math.min(n-1,t.start-1)), b:Math.max(0,Math.min(n-1,t.end-1)), mode:t.mode || 'Forward' };
    return { a:0, b:n-1, mode:'Forward' };
  }
  tagOf(i){ return this.state.tags.find(t => i+1 >= t.start && i+1 <= t.end) || null; }
  pickTag(t){
    this.setState({ activeTag:t.id, active:Math.max(0, t.start-1), playing:false, hint:'Animation: ' + t.name + ' — frames ' + t.start + '–' + t.end });
    clearTimeout(this.timer);
  }
  saveTag(){
    const e = this.state.tagEdit;
    if (!e) return;
    const n = this.state.frames.length;
    const start = Math.max(1, Math.min(n, parseInt(e.start,10) || 1));
    const end = Math.max(start, Math.min(n, parseInt(e.end,10) || start));
    this.setState(s => {
      const tags = s.tags.slice();
      const rec = { id:e.id || 'tg'+Date.now(), name:(e.name||'Animation').trim(), start, end, mode:e.mode || 'Forward', color:e.color || TAG_COLORS[tags.length % TAG_COLORS.length] };
      const i = tags.findIndex(t => t.id === rec.id);
      if (i >= 0) tags[i] = rec; else tags.push(rec);
      return { tags, tagEdit:null, activeTag:rec.id, hint:'Tag ' + rec.name + ' · frames ' + start + '–' + end };
    }, () => this.markDirty());
  }

  /* ── tile set ── */
  addTile(){
    this.setState(s => {
      const tiles = s.tiles.slice();
      tiles.splice(s.activeTile+1, 0, { id:'tl'+Date.now(), name:'Tile ' + (tiles.length+1), px:new Array(s.w*s.h).fill(null) });
      return { tiles, activeTile:s.activeTile+1, workspace:'tiles', hint:'New tile' };
    }, () => this.markDirty());
  }
  dupTile(at){
    this.setState(s => {
      const i = at == null ? s.activeTile : at;
      const src = s.tiles[i];
      const tiles = s.tiles.slice();
      tiles.splice(i+1, 0, { id:'tl'+Date.now(), name:src.name + ' copy', px:src.px.slice() });
      return { tiles, activeTile:i+1, hint:'Duplicated ' + src.name };
    }, () => this.markDirty());
  }
  delTile(at){
    if (this.state.tiles.length <= 1) return;
    this.setState(s => {
      const i = at == null ? s.activeTile : at;
      return { tiles:s.tiles.filter((_,j)=>j!==i), activeTile:Math.max(0, i-1) };
    }, () => this.markDirty());
  }
  renameTile(at){
    const i = at == null ? this.state.activeTile : at;
    const t = this.state.tiles[i];
    const v = window.prompt('Tile name', t.name);
    if (v == null) return;
    this.setState(s => { const tiles = s.tiles.slice(); tiles[i] = {...tiles[i], name:v.trim() || t.name}; return { tiles }; }, () => this.markDirty());
  }
  moveTile(from, to){
    if (to < 0 || to >= this.state.tiles.length || from === to) return;
    this.setState(s => {
      const tiles = s.tiles.slice();
      const [m] = tiles.splice(from,1);
      tiles.splice(to,0,m);
      return { tiles, activeTile:to };
    }, () => this.markDirty());
  }
  tileGeom(){
    const s = this.state, t = s.tileExport, n = Math.max(1, s.tiles.length);
    const c = t.layout==='horizontal' ? n : t.layout==='vertical' ? 1 : Math.max(1, Math.min(t.cols, n));
    const r = Math.ceil(n/c);
    return { c, r, w:t.padding*2 + c*s.w + (c-1)*t.spacing, h:t.padding*2 + r*s.h + (r-1)*t.spacing };
  }
  paintTileSheet(){
    const cv = this.tileSheetRef.current;
    if (!cv) return;
    const s = this.state, t = s.tileExport, g = this.tileGeom();
    const scale = Math.max(1, Math.floor(Math.min(440/g.w, 250/g.h)));
    cv.width = g.w*scale; cv.height = g.h*scale;
    cv.style.width = (g.w*scale)+'px'; cv.style.height = (g.h*scale)+'px';
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.clearRect(0,0,cv.width,cv.height);
    if (!t.transparent){ c.fillStyle = '#15130f'; c.fillRect(0,0,cv.width,cv.height); }
    s.tiles.forEach((tl,i) => {
      const ox = (t.padding + (i%g.c)*(s.w+t.spacing))*scale, oy = (t.padding + Math.floor(i/g.c)*(s.h+t.spacing))*scale;
      this.blit(c, tl.px, s.w, s.h, scale, ox, oy, null, null);
      c.strokeStyle = i===s.activeTile ? 'rgba(225,173,102,.8)' : 'rgba(236,231,222,.16)';
      c.lineWidth = 1;
      c.strokeRect(ox+.5, oy+.5, s.w*scale-1, s.h*scale-1);
    });
    if (this.tileDragFrom != null){
      const rectOf = idx => ({ ox:(t.padding + (idx%g.c)*(s.w+t.spacing))*scale, oy:(t.padding + Math.floor(idx/g.c)*(s.h+t.spacing))*scale, w:s.w*scale, h:s.h*scale });
      const a = rectOf(this.tileDragFrom);
      c.fillStyle = 'rgba(21,19,15,.55)'; c.fillRect(a.ox, a.oy, a.w, a.h);
      if (this.tileDragOver != null){
        const b = rectOf(this.tileDragOver);
        c.fillStyle = 'rgba(225,173,102,.16)'; c.fillRect(b.ox, b.oy, b.w, b.h);
        c.strokeStyle = '#e1ad66'; c.lineWidth = 2; c.strokeRect(b.ox+1, b.oy+1, b.w-2, b.h-2);
      }
    }
  }
  tileSheetHit(e){
    const cv = this.tileSheetRef.current;
    if (!cv) return null;
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    const s = this.state, t = s.tileExport, g = this.tileGeom();
    const lx = (e.clientX - r.left) * (g.w / r.width), ly = (e.clientY - r.top) * (g.h / r.height);
    for (let i=0;i<s.tiles.length;i++){
      const ox = t.padding + (i%g.c)*(s.w+t.spacing), oy = t.padding + Math.floor(i/g.c)*(s.h+t.spacing);
      if (lx>=ox && lx<ox+s.w && ly>=oy && ly<oy+s.h) return i;
    }
    return null;
  }
  tileDragDown(e){
    const i = this.tileSheetHit(e);
    if (i == null) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    this.tileDragFrom = i; this.tileDragOver = i;
    this.setState({ activeTile:i, hint:'Drag to rearrange tiles — drop on another cell' });
  }
  tileDragMove(e){
    if (this.tileDragFrom == null) return;
    const i = this.tileSheetHit(e);
    const over = i == null ? this.tileDragOver : i;
    if (over !== this.tileDragOver){ this.tileDragOver = over; this.forceUpdate(); }
  }
  tileDragUp(e){
    if (this.tileDragFrom == null) return;
    const from = this.tileDragFrom, to = this.tileDragOver;
    this.tileDragFrom = null; this.tileDragOver = null;
    if (to != null && to !== from) this.moveTile(from, to);
    else this.forceUpdate();
  }

  /* ── tile inspector (Wang corner terrains + metadata) ── */
  setTileField(patch){
    this.setState(v => { const tiles = v.tiles.slice(); const i = v.activeTile; if (!tiles[i]) return null; tiles[i] = {...tiles[i], ...patch}; return { tiles }; }, () => this.markDirty());
  }
  setCorner(ci, terrain){
    this.setState(v => {
      const tiles = v.tiles.slice(); const i = v.activeTile; const t = tiles[i]; if (!t) return null;
      const corners = (t.corners && t.corners.length === 4) ? t.corners.slice() : [null,null,null,null];
      corners[ci] = terrain;
      tiles[i] = {...t, corners};
      return { tiles };
    }, () => this.markDirty());
  }
  fillCorners(terrain){
    this.setState(v => { const tiles = v.tiles.slice(); const i = v.activeTile; if (!tiles[i]) return null; tiles[i] = {...tiles[i], corners:[terrain,terrain,terrain,terrain]}; return { tiles }; }, () => this.markDirty());
  }
  addTerrain(name){
    const n = (name || '').trim().toLowerCase().replace(/\s+/g,'_');
    if (!n) return;
    this.setState(v => v.terrains.includes(n) ? { terrainDraft:'', hint:'"' + n + '" is already a terrain' } : { terrains:v.terrains.concat([n]), terrainDraft:'', hint:'Added terrain "' + n + '"' }, () => this.markDirty());
  }
  removeTerrain(name){
    this.setState(v => {
      const terrains = v.terrains.filter(t => t !== name);
      const tiles = v.tiles.map(t => (t.corners && t.corners.some(c => c === name)) ? {...t, corners:t.corners.map(c => c === name ? null : c)} : t);
      return { terrains, tiles, hint:'Removed terrain "' + name + '"' };
    }, () => this.markDirty());
  }

  exportTileSet(){
    const s = this.state, t = s.tileExport, g = this.tileGeom();
    const cv = document.createElement('canvas');
    cv.width = g.w; cv.height = g.h;
    const c = cv.getContext('2d');
    if (!t.transparent){ c.fillStyle = '#15130f'; c.fillRect(0,0,g.w,g.h); }
    s.tiles.forEach((tl,i) => {
      const ox = t.padding + (i%g.c)*(s.w+t.spacing), oy = t.padding + Math.floor(i/g.c)*(s.h+t.spacing);
      this.blit(c, tl.px, s.w, s.h, 1, ox, oy, null, null);
    });
    this.dl(cv, (this.state.projectName || 'tileset') + '-tileset.png');
    this.setState({ hint:'Exported tile set ' + g.w + '×' + g.h });
  }
  tileMeta(){
    const s = this.state, t = s.tileExport, g = this.tileGeom();
    const tiles = {};
    s.tiles.forEach((tl,i) => {
      const key = tl.name.toLowerCase().replace(/\s+/g,'_');
      const entry = { index:i, kind: tl.kind || 'ground' };
      if ((tl.kind === 'terrain') && tl.corners && tl.corners.length === 4 && tl.corners.every(Boolean)) entry.corners = tl.corners.slice();
      if (tl.collision) entry.collision = true;
      const tags = (tl.tags || '').split(',').map(x => x.trim()).filter(Boolean);
      if (tags.length) entry.tags = tags;
      tiles[key] = entry;
    });
    return {
      image:(s.projectName||'tileset') + '-tileset.png',
      tileWidth:s.w, tileHeight:s.h, count:s.tiles.length,
      columns:g.c, spacing:t.spacing, padding:t.padding,
      terrains: s.terrains.slice(),
      tiles
    };
  }
  exportTileMeta(){
    const meta = this.tileMeta();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(meta, null, 2)], {type:'application/json'}));
    a.download = (this.state.projectName||'tileset') + '-tileset.json';
    document.body.appendChild(a); a.click(); a.remove();
    this.setState({ hint:'Exported tile set metadata' });
  }
  paintTileRepeat(){
    const cv = this.previewRef.current;
    if (!cv) return;
    const s = this.state, W = s.w, H = s.h, r = s.tilePreview;
    cv.width = W*r; cv.height = H*r;
    const box = 92, dispScale = box / Math.max(W*r, H*r);
    cv.style.width = (W*r*dispScale)+'px'; cv.style.height = (H*r*dispScale)+'px';
    const c = cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,W*r,H*r);
    const tl = s.tiles[s.activeTile];
    if (!tl) return;
    for (let ty=0;ty<r;ty++) for (let tx=0;tx<r;tx++) this.blit(c, tl.px, W, H, 1, tx*W, ty*H, null, null);
  }

  /* ── atlas (free-size decor sprites, packed into one sheet) ── */
  resizeCurrent(nw, nh){
    if (this.state.workspace === 'atlas') this.setAtlasDims(this.state.activeAtlas, nw, nh);
    else this.setDims(nw, nh);
  }
  clearCurrent(){
    this.snap();
    const ws = this.state.workspace;
    if (ws === 'atlas'){ this.setState(v => { const atlas=v.atlas.slice(); const it=atlas[v.activeAtlas]; if(!it) return null; atlas[v.activeAtlas]={...it, px:new Array(it.w*it.h).fill(null)}; return { atlas, hint:'Cleared '+it.name }; }); return; }
    if (ws === 'tiles'){ this.setState(v => { const tiles=v.tiles.slice(); const t=tiles[v.activeTile]; if(!t) return null; tiles[v.activeTile]={...t, px:new Array(v.w*v.h).fill(null)}; return { tiles, hint:'Cleared '+t.name }; }); return; }
    this.setState(v => { const frames=v.frames.slice(); frames[v.active]={...frames[v.active], px:new Array(v.w*v.h).fill(null)}; return { frames, hint:'Cleared frame '+(v.active+1) }; });
  }
  setAtlasDims(i, nw, nh){
    nw = Math.max(1, Math.min(256, Math.round(nw) || 0));
    nh = Math.max(1, Math.min(256, Math.round(nh) || 0));
    const it = this.state.atlas[i];
    if (!it || !nw || !nh || (it.w === nw && it.h === nh)) return;
    this.snap();
    this.setState(s => {
      const atlas = s.atlas.slice();
      const out = new Array(nw*nh).fill(null);
      const ox = Math.floor((nw - it.w)/2), oy = Math.floor((nh - it.h)/2);
      for (let y=0;y<it.h;y++) for (let x=0;x<it.w;x++){ const dx=x+ox, dy=y+oy; if (dx>=0&&dx<nw&&dy>=0&&dy<nh) out[dy*nw+dx] = it.px[y*it.w+x]; }
      atlas[i] = {...it, w:nw, h:nh, px:out};
      return { atlas, selRect:null, hint:it.name + ' → ' + nw + '×' + nh };
    }, () => this.fit());
  }
  addAtlasItem(){
    this.setState(s => {
      const atlas = s.atlas.slice();
      const it = atlas[s.activeAtlas];
      const w = it ? it.w : 16, h = it ? it.h : 16;
      const at = atlas.length ? s.activeAtlas+1 : 0;
      atlas.splice(at, 0, { id:'a'+Date.now(), name:'sprite_'+(atlas.length+1), w, h, px:new Array(w*h).fill(null) });
      return { atlas, activeAtlas:at, workspace:'atlas', hint:'New sprite ('+w+'×'+h+') — set its size in the toolbar' };
    }, () => { this.fit(); this.markDirty(); });
  }
  dupAtlasItem(at){
    this.setState(s => {
      const i = at == null ? s.activeAtlas : at;
      const src = s.atlas[i]; if (!src) return null;
      const atlas = s.atlas.slice();
      atlas.splice(i+1, 0, { id:'a'+Date.now(), name:src.name+' copy', w:src.w, h:src.h, px:src.px.slice() });
      return { atlas, activeAtlas:i+1, hint:'Duplicated '+src.name };
    }, () => this.markDirty());
  }
  delAtlasItem(at){
    if (!this.state.atlas.length) return;
    this.setState(s => { const i = at == null ? s.activeAtlas : at; return { atlas:s.atlas.filter((_,j)=>j!==i), activeAtlas:Math.max(0, Math.min(s.atlas.length-2, i-1)) }; }, () => { this.fit(); this.markDirty(); });
  }
  renameAtlasItem(at){
    const i = at == null ? this.state.activeAtlas : at;
    const it = this.state.atlas[i]; if (!it) return;
    const v = window.prompt('Sprite name', it.name);
    if (v == null) return;
    this.setState(s => { const atlas = s.atlas.slice(); atlas[i] = {...atlas[i], name:v.trim() || it.name}; return { atlas }; }, () => this.markDirty());
  }
  moveAtlasItem(from, to){
    if (to < 0 || to >= this.state.atlas.length || from === to) return;
    this.setState(s => { const atlas = s.atlas.slice(); const [m]=atlas.splice(from,1); atlas.splice(to,0,m); return { atlas, activeAtlas:to }; }, () => this.markDirty());
  }
  atlasGeom(){
    const s = this.state, e = s.atlasExport, sp = e.spacing, pad = e.padding;
    if (!s.atlas.length) return { rects:[], w:1, h:1 };
    const packed = packRects(s.atlas.map(a => ({ w:a.w+sp, h:a.h+sp })));
    const rects = s.atlas.map((a,i) => ({ name:a.name, i, x:pad+packed.pos[i].x, y:pad+packed.pos[i].y, w:a.w, h:a.h }));
    let maxX=0, maxY=0; rects.forEach(r => { maxX=Math.max(maxX, r.x+r.w); maxY=Math.max(maxY, r.y+r.h); });
    return { rects, w:maxX+pad, h:maxY+pad };
  }
  paintAtlasSheet(){
    const cv = this.atlasSheetRef.current;
    if (!cv) return;
    const s = this.state, e = s.atlasExport, g = this.atlasGeom();
    const scale = Math.max(1, Math.floor(Math.min(440/g.w, 250/g.h)));
    cv.width = g.w*scale; cv.height = g.h*scale;
    cv.style.width = (g.w*scale)+'px'; cv.style.height = (g.h*scale)+'px';
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.clearRect(0,0,cv.width,cv.height);
    if (!e.transparent){ c.fillStyle = '#15130f'; c.fillRect(0,0,cv.width,cv.height); }
    g.rects.forEach(r => {
      this.blit(c, s.atlas[r.i].px, r.w, r.h, scale, r.x*scale, r.y*scale, null, null);
      c.strokeStyle = r.i===s.activeAtlas ? 'rgba(225,173,102,.8)' : 'rgba(236,231,222,.16)';
      c.lineWidth = 1;
      c.strokeRect(r.x*scale+.5, r.y*scale+.5, r.w*scale-1, r.h*scale-1);
    });
  }
  exportAtlasSet(){
    const s = this.state, e = s.atlasExport, g = this.atlasGeom();
    const cv = document.createElement('canvas');
    cv.width = g.w; cv.height = g.h;
    const c = cv.getContext('2d');
    if (!e.transparent){ c.fillStyle = '#15130f'; c.fillRect(0,0,g.w,g.h); }
    g.rects.forEach(r => this.blit(c, s.atlas[r.i].px, r.w, r.h, 1, r.x, r.y, null, null));
    this.dl(cv, (s.projectName||'atlas') + '-atlas.png');
    this.setState({ hint:'Exported atlas ' + g.w + '×' + g.h });
  }
  atlasMeta(){
    const s = this.state, e = s.atlasExport, g = this.atlasGeom();
    const sprites = {};
    g.rects.forEach(r => {
      const a = s.atlas[r.i];
      const entry = { x:r.x, y:r.y, w:r.w, h:r.h, kind:a.kind || 'decor' };
      if (a.collision) entry.collision = true;
      const tags = (a.tags||'').split(',').map(x => x.trim()).filter(Boolean);
      if (tags.length) entry.tags = tags;
      sprites[r.name.toLowerCase().replace(/\s+/g,'_')] = entry;
    });
    return { image:(s.projectName||'atlas') + '-atlas.png', width:g.w, height:g.h, count:s.atlas.length, padding:e.padding, spacing:e.spacing, sprites };
  }
  setAtlasField(patch){
    this.setState(v => { const atlas = v.atlas.slice(); const i = v.activeAtlas; if (!atlas[i]) return null; atlas[i] = {...atlas[i], ...patch}; return { atlas }; }, () => this.markDirty());
  }
  atlasSheetHit(e){
    const cv = this.atlasSheetRef.current;
    if (!cv) return null;
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    const g = this.atlasGeom();
    const lx = (e.clientX - r.left) * (g.w / r.width), ly = (e.clientY - r.top) * (g.h / r.height);
    for (const rect of g.rects){ if (lx>=rect.x && lx<rect.x+rect.w && ly>=rect.y && ly<rect.y+rect.h) return rect.i; }
    return null;
  }
  atlasSheetDown(e){
    const i = this.atlasSheetHit(e);
    if (i != null) this.setState({ activeAtlas:i });
  }
  exportAtlasMeta(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this.atlasMeta(), null, 2)], {type:'application/json'}));
    a.download = (this.state.projectName||'atlas') + '-atlas.json';
    document.body.appendChild(a); a.click(); a.remove();
    this.setState({ hint:'Exported atlas metadata' });
  }

  /* ── menus ── */
  openMenu(kind, i, e){
    e.preventDefault(); e.stopPropagation();
    const x = Math.min(e.clientX, window.innerWidth - 230);
    const y = Math.max(10, Math.min(e.clientY, window.innerHeight - 300));
    const patch = { menu:{ kind, i, x, y } };
    if (kind === 'frame') patch.active = i;
    if (kind === 'tile') patch.activeTile = i;
    if (kind === 'atlas') patch.activeAtlas = i;

  }
  menuTitleText(){
    const m = this.state.menu;
    if (!m) return '';
    if (m.kind === 'file') return 'Project';
    if (m.kind === 'tag'){ const t = this.state.tags[m.i]; return t ? t.name : 'Tag'; }
    if (m.kind === 'tile'){ const t = this.state.tiles[m.i]; return t ? t.name : 'Tile'; }
    if (m.kind === 'atlas'){ const a = this.state.atlas[m.i]; return a ? a.name : 'Sprite'; }
    return 'Frame ' + (m.i+1);
  }
  menuFor(){
    const m = this.state.menu;
    if (!m) return [];
    const s = this.state;
    const close = fn => () => { this.setState({menu:null}); if (fn) fn(); };
    if (m.kind === 'file') return [
      { label:'New Project…', note:'', click:close(()=>this.setState({ newOpen:true, npName:'untitled', npW:s.w, npH:s.h })) },
      { label:'Open Project…', note:'⌘O', click:close(()=>this.projRef.current && this.projRef.current.click()) },
      { label:'Save', note:'⌘S', click:close(()=>this.saveProject(false)) },
      { label:'Save As…', note:'⇧⌘S', click:close(()=>this.saveProject(true)) },
      { label:'Import Image…', note:'', click:close(()=>this.fileRef.current && this.fileRef.current.click()) },
      { label:'Export PNG', note:'', click:close(()=>this.exportPng()) },
      { label:'Export Sprite Sheet…', note:'', click:close(()=>this.setState({sheetOpen:true})) },
      { label:'Export Tile Set…', note:'', click:close(()=>this.setState({tileSheetOpen:true})) }
    ];
    if (m.kind === 'tag'){
      const t = s.tags[m.i];
      if (!t) return [];
      return [
        { label:'Set as active animation', note:'', click:close(()=>this.pickTag(t)) },
        { label:'Rename / edit range…', note:'', click:close(()=>this.setState({ tagEdit:{...t} })) },
        { label:'Duplicate tag', note:'', click:close(()=>this.setState(v=>({ tags:v.tags.concat([{...t, id:'tg'+Date.now(), name:t.name+' copy'}]) }), ()=>this.markDirty())) },
        { label:'Playback: Forward', note:'', click:close(()=>this.setTagMode(m.i,'Forward')) },
        { label:'Playback: Reverse', note:'', click:close(()=>this.setTagMode(m.i,'Reverse')) },
        { label:'Playback: Ping Pong', note:'', click:close(()=>this.setTagMode(m.i,'Ping Pong')) },
        { label:'Delete tag', note:'', click:close(()=>this.setState(v=>({ tags:v.tags.filter((_,j)=>j!==m.i), activeTag:v.activeTag===t.id?null:v.activeTag }), ()=>this.markDirty())) }
      ];
    }
    if (m.kind === 'tile') return [
      { label:'Duplicate tile', note:'', click:close(()=>this.dupTile(m.i)) },
      { label:'Rename tile…', note:'', click:close(()=>this.renameTile(m.i)) },
      { label:'Move left', note:'', click:close(()=>this.moveTile(m.i, m.i-1)) },
      { label:'Move right', note:'', click:close(()=>this.moveTile(m.i, m.i+1)) },
      { label:'Delete tile', note:'', click:close(()=>this.delTile(m.i)) }
    ];
    if (m.kind === 'atlas') return [
      { label:'Duplicate sprite', note:'', click:close(()=>this.dupAtlasItem(m.i)) },
      { label:'Rename sprite…', note:'', click:close(()=>this.renameAtlasItem(m.i)) },
      { label:'Move left', note:'', click:close(()=>this.moveAtlasItem(m.i, m.i-1)) },
      { label:'Move right', note:'', click:close(()=>this.moveAtlasItem(m.i, m.i+1)) },
      { label:'Delete sprite', note:'', click:close(()=>this.delAtlasItem(m.i)) }
    ];
    return [
      { label:'Duplicate', note:'', click:close(()=>this.dupFrame(m.i)) },
      { label:'Duplicate + Transform', note:'', click:close(()=>this.dupFrame(m.i, ()=>this.setState(v=>({tfx:v.active})))) },
      { label:'Move left', note:'', click:close(()=>{ if (m.i>0) this.reorder(m.i, m.i-1); }) },
      { label:'Move right', note:'', click:close(()=>{ if (m.i<s.frames.length-1) this.reorder(m.i, m.i+1); }) },
      { label:'Transform in place', note:'', click:close(()=>this.setState({tfx:m.i})) },
      { label:'Create animation tag…', note:'', click:close(()=>this.setState({ tagEdit:{ id:null, name:'Animation', start:m.i+1, end:Math.min(s.frames.length, m.i+4), mode:'Forward' } })) },
      { label:'Delete frame', note:'', click:close(()=>this.delFrame(m.i)) }
    ];
  }
  setTagMode(i, mode){
    this.setState(s => { const tags = s.tags.slice(); tags[i] = {...tags[i], mode}; return { tags, hint:tags[i].name + ' · ' + mode }; }, () => this.markDirty());

      title:t.name + ' — click to edit, right-click for options, drag to reorder',
      on:i === s.activeTile, sel:false, dur:0, tagColor:'transparent',

      pick:()=>this.setState({ activeTile:i, hint:'Editing tile ' + t.name }),
      dup:()=>this.dupTile(i),
      menu:e=>this.openMenu('tile', i, e),
      toggleSel:()=>{},
      dragStart:e=>{ this.dragFrom = i; e.dataTransfer.effectAllowed='move'; },
      dragOver:e=>e.preventDefault(),
      drop:e=>{ e.preventDefault(); if (this.dragFrom != null) this.moveTile(this.dragFrom, i); this.dragFrom = null; }
    }));
    if (s.workspace === 'atlas') return s.atlas.map((a,i) => ({
      label:a.name, sub:a.w + '×' + a.h, isFrame:false, hasTag:false,

      toggleSel:()=>{},

      dragOver:e=>e.preventDefault(),
      drop:e=>{ e.preventDefault(); if (this.dragFrom != null) this.moveAtlasItem(this.dragFrom, i); this.dragFrom = null; }
    }));
    return s.frames.map((f,i) => {
      const tg = this.tagOf(i);

        label:String(i+1).padStart(2,'0'), sub:f.dur + ' ms', isFrame:true,
        hasTag:!!tg, tagColor:tg ? tg.color : 'transparent',

        pick:()=>this.setState({active:i}),

        menu:e=>this.openMenu('frame', i, e),
        toggleSel:()=>this.setState(v=>{ const frames=v.frames.slice(); frames[i]={...frames[i], sel:!frames[i].sel}; return {frames}; }),
        dragStart:e=>{ this.dragFrom = i; e.dataTransfer.effectAllowed='move'; },
        dragOver:e=>e.preventDefault(),
        drop:e=>{ e.preventDefault(); if (this.dragFrom != null) this.reorder(this.dragFrom, i); this.dragFrom = null; }
      };
    });
  }
