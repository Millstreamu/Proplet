      viewToggles: [
        { label:'Grid', tip:'Pixel grid — G', on:s.grid, icon:mkIcon(IC.grid, false, 14), click:()=>this.setState(v=>({grid:!v.grid})) },
        { label:'Tile', tip:'Tile mode — T', on:s.tile, icon:mkIcon(IC.tile, false, 14), click:()=>this.setState(v=>({tile:!v.tile, hint:v.tile?'Tile mode off':'Tile mode — the centre tile is editable'}), ()=>this.fit()) },
        { label:'Mirror H', tip:'Mirror across the vertical axis — H', on:s.mirrorH, icon:mkIcon(IC.mirrorH, false, 14), click:()=>this.setState(v=>({mirrorH:!v.mirrorH})) },
        { label:'Mirror V', tip:'Mirror across the horizontal axis — V', on:s.mirrorV, icon:mkIcon(IC.mirrorV, false, 14), click:()=>this.setState(v=>({mirrorV:!v.mirrorV})) },
        { label:'Onion', tip:'Onion skin — O', on:s.onion.on, icon:mkIcon(IC.onion, false, 14), click:()=>this.setState(v=>({onion:{...v.onion, on:!v.onion.on}})) },
        { label:'Wrap', tip:'Wrap drawing across the tile edges — W', on:s.wrap, icon:mkIcon(IC.wrap, false, 14), click:()=>this.setState(v=>({wrap:!v.wrap, hint:v.wrap?'Wrap drawing off':'Wrap drawing on — paint past an edge and it wraps'})) }
      ],

      shadeModes: [['ramp','Palette ramp','Lighten and darken step along a ramp'],['rgb','Basic RGB','Lighten and darken shift the raw colour']].map(([id,label,tip]) => ({
        label, tip, on:s.shadeMode===id, pick:()=>this.setState({shadeMode:id, hint:'Shading: '+label})
      })),

      sizes: [16,32,48,64].map(n => ({ label:n+'²', title:(s.workspace==='atlas'?'Resize this sprite to ':'Resize canvas to ')+n+'×'+n, on:D.w===n && D.h===n, pick:()=>this.resizeCurrent(n,n) })),
      dimsText: D.w + '×' + D.h,
      dimsTitle: s.workspace==='atlas' ? 'This sprite’s size — type W×H (e.g. 32x64). Only this sprite changes.' : 'Canvas size — type W×H (e.g. 32x64). Resizes all frames & tiles.',
      setDimsText: e => {
        const m = String(e.target.value).toLowerCase().match(/(\d+)\s*[x×,\s]\s*(\d+)/);
        if (m) this.resizeCurrent(parseInt(m[1],10), parseInt(m[2],10));
        else { const n = parseInt(e.target.value,10); if (n) this.resizeCurrent(n, n); }
      },
      clearCanvas: () => this.clearCurrent(),
      openImport: () => this.fileRef.current && this.fileRef.current.click(),
      onImport: e => this.onImport(e),
      exportPng: () => this.exportPng(),
      fileRef: this.fileRef,

      mainCursor: s.refMove ? 'move' : 'crosshair',
      refInputRef: this.refInputRef,
      loadRef: () => this.refInputRef.current && this.refInputRef.current.click(),
      onLoadRef: e => this.loadRefImage(e),
      clearRef: () => this.clearRefImage(),
      hasRef: !!this.refImg,
      refOn: s.refOn,
      toggleRefOn: () => this.setState(v=>({refOn:!v.refOn})),
      refOpacity: s.refOpacity,
      setRefOpacity: e => this.setState({refOpacity:+e.target.value}),
      refScale: s.refScale,
      setRefScale: e => this.setState({refScale:+e.target.value}),
      refMove: s.refMove,
      toggleRefMove: () => this.setState(v=>({refMove:!v.refMove, hint:v.refMove?'Reference locked':'Drag on the canvas to position the reference'})),
      centerRef: () => this.setState({refX:0, refY:0, refScale:100, hint:'Reference re-centred'}),
      undo: () => this.undo(),
      redo: () => this.redo(),

      mainRef: this.mainRef,
      previewRef: this.previewRef,
      sheetRef: this.sheetRef,
      tfxRef: this.tfxRef,
      onDown: e => this.down(e),
      onMove: e => this.move(e),
      onUp: () => this.up(),
      onLeave: () => { this.up(); this.setState({hover:null}); },

      zoomIn: () => { this.autoFit = false; this.setState(v=>({cell:Math.min(40, v.cell+2)})); },
      zoomOut: () => { this.autoFit = false; this.setState(v=>({cell:Math.max(2, v.cell-2)})); },
      zoomFit: () => { this.autoFit = true; this.fit(); },
      zoomText: (s.cell*100) + '%',

      fgColor: s.fg,
      bgColor: s.bg,
      hexText: s.fg.replace('#','').toUpperCase(),
      setFg: e => this.setState({fg:e.target.value}),
      setHex: e => { const v = '#' + e.target.value.replace('#','').trim(); if (/^#[0-9a-f]{6}$/i.test(v)) this.setState({fg:v}); },
      swapColors: () => this.setState(v=>({fg:v.bg, bg:v.fg})),
      swatches: s.palette.map(c => ({
        color: c, on: c.toLowerCase()===s.fg.toLowerCase(), title: c.toUpperCase()+' — right-click to remove',
        pick: () => this.setState({fg:c}),
        remove: e => { e.preventDefault(); this.setState(v=>({palette:v.palette.filter(x=>x!==c)})); }
      })),
      addSwatch: () => this.setState(v => v.palette.includes(v.fg) ? {hint:'Already in palette'} : {palette:v.palette.concat([v.fg]), hint:'Added '+v.fg.toUpperCase()}),
      recents: s.recent.map(c => ({ color:c, title:c.toUpperCase(), pick:()=>this.setState({fg:c}) })),
      noRecents: s.recent.length === 0,

      ramps: s.ramps.map((r, ri) => ({
        name: r.name,
        stops: r.colors.map((c, ci) => ({
          color: c, on: c.toLowerCase()===s.fg.toLowerCase(), title: c.toUpperCase()+' — step '+(ci+1)+' of '+r.colors.length,
          pick: () => this.setState({fg:c}),
          remove: e => { e.preventDefault(); this.setState(v=>{ const ramps=v.ramps.map(x=>({...x, colors:x.colors.slice()})); ramps[ri].colors.splice(ci,1); return {ramps}; }); },
          dragStart: e => { this.rampDrag = {ri, ci}; e.dataTransfer.effectAllowed='move'; },
          dragOver: e => e.preventDefault(),
          drop: e => {
            e.preventDefault();
            const d = this.rampDrag;
            if (!d || d.ri !== ri) return;
            this.setState(v => { const ramps=v.ramps.map(x=>({...x, colors:x.colors.slice()})); const [m]=ramps[ri].colors.splice(d.ci,1); ramps[ri].colors.splice(ci,0,m); return {ramps}; });
            this.rampDrag = null;
          }
        })),
        add: () => this.setState(v=>{ const ramps=v.ramps.map(x=>({...x, colors:x.colors.slice()})); ramps[ri].colors.push(v.fg); return {ramps, hint:'Added '+v.fg.toUpperCase()+' to '+r.name}; }),
        remove: () => this.setState(v=>({ ramps:v.ramps.filter((_,i)=>i!==ri) }))
      })),
      addRamp: () => this.setState(v=>({ ramps:v.ramps.concat([{ name:'Ramp '+(v.ramps.length+1), colors:[shade(v.fg,-.35), shade(v.fg,-.18), v.fg, shade(v.fg,.2)] }]), hint:'New ramp from '+v.fg.toUpperCase() })),

      onionOn: s.onion.on,
      onionLabel: s.onion.on ? 'On' : 'Off',
      toggleOnion: () => this.setState(v=>({onion:{...v.onion, on:!v.onion.on}})),
      prevOpts: [0,1,2].map(n => ({ label:n, on:s.onion.prev===n, pick:()=>this.setState(v=>({onion:{...v.onion, prev:n, on:true}})) })),
      nextOpts: [0,1,2].map(n => ({ label:n, on:s.onion.next===n, pick:()=>this.setState(v=>({onion:{...v.onion, next:n, on:true}})) })),
      onionOpacity: s.onion.opacity,
      setOnionOpacity: e => { const v = +e.target.value; this.setState(o=>({onion:{...o.onion, opacity:v}})); },

      hasSel: !!s.selRect,
      tileOn: s.tile,
      selText: s.selRect ? (s.selRect.w + '×' + s.selRect.h + ' at ' + s.selRect.x + ',' + s.selRect.y) : '',
      selActions: [
        { label:'Copy', tip:'Copy selection — ⌘C', click:()=>this.selCopy() },
        { label:'Cut', tip:'Cut selection — ⌘X', click:()=>this.selCut() },
        { label:'Paste', tip:'Paste at the selection origin — ⌘V', click:()=>this.selPaste() },
        { label:'Delete', tip:'Clear the selected pixels — Delete', click:()=>this.selDelete() },
        { label:'Flip H', tip:'Flip the selection horizontally', click:()=>this.selTransform('flipH') },
        { label:'Flip V', tip:'Flip the selection vertically', click:()=>this.selTransform('flipV') },
        { label:'Rotate', tip:'Rotate the selection 90°', click:()=>this.selTransform('rot') },
        { label:'Deselect', tip:'Drop the selection — Esc', click:()=>this.setState({selRect:null}) }
      ],

      togglePlay: () => this.play(),
      playLabel: s.playing ? 'Pause' : 'Play',
      playIcon: React.createElement('svg', {width:13, height:13, viewBox:'0 0 24 24', className:'ic'},
        s.playing
          ? [React.createElement('path',{key:'a', d:'M9 4v16'}), React.createElement('path',{key:'b', d:'M15 4v16'})]
          : [React.createElement('path',{key:'p', d:'M7 4l13 8-13 8z'})]),
      durPresets: [60,100,160,240].map(n => ({ label:n, title:'Set every frame to '+n+' ms', pick:()=>this.setState(v=>({frames:v.frames.map(f=>({...f, dur:n})), hint:'All frames set to '+n+' ms'})) })),

      activeDur: s.frames[s.active].dur,
      setDur: e => this.setDur(s.active, parseInt(e.target.value,10) || 100),
      durUp: () => this.setDur(s.active, (s.frames[s.active].dur||100) + 20),
      durDown: () => this.setDur(s.active, (s.frames[s.active].dur||100) - 20),

      frameCount: s.frames.length,
      totalMs: totalMs + ' ms',
      addFrame: () => this.addFrame(),
      dupFrame: () => this.dupFrame(),
      dupTransform: () => this.dupFrame(null, () => this.setState(v=>({tfx:v.active}))),
      delFrame: () => this.delFrame(),
      stop: e => e.stopPropagation(),

      menuOpen: !!menu,
      menuX: menu ? menu.x : 0,
      menuY: menu ? menu.y : 0,
      menuTitle: this.menuTitleText(),
      menuItems,
      closeMenu: () => this.setState({menu:null}),

      tfxOpen: s.tfx != null,
      tfxTitle: s.tfx != null ? ('Frame ' + (s.tfx+1) + ' of ' + s.frames.length) : '',
      tfxActions: tfxKinds.map(([kind,label]) => ({ label, click:()=>this.transformFrame(s.tfx, kind) })),
      closeTfx: () => this.setState({tfx:null}),

      dimText: s.w + ' × ' + s.h + ' px',
      frameText: 'Frame ' + (s.active+1) + ' of ' + s.frames.length,
      mirrorText: s.mirrorH && s.mirrorV ? 'Both' : s.mirrorH ? 'Horizontal' : s.mirrorV ? 'Vertical' : 'Off',
      tileText: s.tile ? 'On' : 'Off',
      onionText: s.onion.on ? (s.onion.prev + '←→' + s.onion.next) : 'Off',
      coordText: s.hover ? ('X ' + String(s.hover.x).padStart(2,'0') + '  Y ' + String(s.hover.y).padStart(2,'0')) : 'X —  Y —',
      hint: s.hint,

      sheetOpen: s.sheetOpen,
      openSheet: () => this.setState({sheetOpen:true}),
      closeSheet: () => this.setState({sheetOpen:false}),
      layouts: [['horizontal','Horizontal'],['vertical','Vertical'],['grid','Grid']].map(([id,label]) => ({
        label, on:s.layout===id, pick:()=>this.setState({layout:id})
      })),
      isGrid: s.layout === 'grid',
      cols: s.cols,
      colsUp: () => this.setState(v=>({cols:Math.min(12, v.cols+1)})),
      colsDown: () => this.setState(v=>({cols:Math.max(1, v.cols-1)})),
      spacing: s.spacing,
      padding: s.padding,
      setSpacing: e => this.setState({spacing:+e.target.value}),
      setPadding: e => this.setState({padding:+e.target.value}),
      transparent: s.transparent,
      setTransparent: e => this.setState({transparent:e.target.checked}),
      exportScopes: [['all','All frames'],['anim','Current animation'],['selected','Checked frames']].map(([id,label]) => ({
        label, on:s.exportScope===id, pick:()=>this.setState({exportScope:id})
      })),
      scopeNote: s.exportScope==='anim'
        ? (this.activeTagObj() ? ('Animation: ' + this.activeTagObj().name + ' · frames ' + this.activeTagObj().start + '–' + this.activeTagObj().end) : 'No animation tag selected — exporting all frames')
        : s.exportScope==='selected' ? 'Only frames with the checkbox ticked' : 'Every frame in the timeline',
      showCells: s.showCells,
      setShowCells: e => this.setState({showCells:e.target.checked}),
      sheetFrames: g.list.length,
      sheetDim: g.w + ' × ' + g.h,
      exportSheet: () => this.exportSheet()
    };
  }

  render(){
    const R = this.renderVals();
    return (
      <div style={css("height:100vh;min-height:660px;min-width:1180px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;background:var(--bg0)")}>

        <header style={css("display:flex;align-items:center;gap:16px;height:50px;padding:0 14px;background:var(--bg1);border-bottom:1px solid var(--line)")}>
          <div style={css("display:flex;align-items:baseline;gap:9px;padding-right:15px;border-right:1px solid var(--line);line-height:1;flex:none;white-space:nowrap")}>
            <span style={css("font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.01em;color:var(--fg)")}>Pixel Studio</span>
            <span style={css("font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)")}>Sprite Ed.</span>
          </div>

          <div style={css("display:flex;align-items:center;gap:2px;flex:none")}>
            <Hov title="Undo — Ctrl/Cmd + Z" onClick={R.undo} s="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--dim)" sh="background:rgba(236,231,222,.07);color:var(--fg)"><svg width="17" height="17" viewBox="0 0 24 24" className="ic"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg></Hov>
            <Hov title="Redo — Ctrl/Cmd + Shift + Z" onClick={R.redo} s="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--dim)" sh="background:rgba(236,231,222,.07);color:var(--fg)"><svg width="17" height="17" viewBox="0 0 24 24" className="ic"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg></Hov>
          </div>

          <div style={css("width:1px;height:24px;background:var(--line);flex:none")}></div>

          <div style={css("display:flex;align-items:center;gap:2px;flex:none;white-space:nowrap")}>
            <Hov title="Project actions — new, open, save, import, export" onClick={R.openFileMenu} s="display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;color:var(--dim)" sh="color:var(--fg);border-color:rgba(236,231,222,.3)"><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>File<span style={css("font-size:9px;opacity:.7")}>▾</span></Hov>
            <Hov title="Save project — Ctrl/Cmd + S" onClick={R.quickSave} s="display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;color:var(--dim)" sh="color:var(--fg);border-color:rgba(236,231,222,.3)"><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path></svg>Save</Hov>
            <Hov title="Clear the current frame or tile" onClick={R.clearCanvas} s="display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;color:var(--dim)" sh="color:var(--fg);border-color:rgba(236,231,222,.3)"><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path></svg>Clear</Hov>
          </div>

          <div style={css("display:flex;flex-direction:column;gap:1px;padding:0 13px;border-left:1px solid var(--line);flex:none;white-space:nowrap;min-width:0")}>
            <div style={css("display:flex;align-items:center;gap:5px;font-size:12px;color:var(--fg);letter-spacing:.02em")}>
              <span style={css("overflow:hidden;text-overflow:ellipsis;max-width:190px")}>{R.projName}</span>
              {R.isDirty && <span title="Unsaved changes in the project file" style={css("color:var(--gold);font-size:14px;line-height:1")}>*</span>}
            </div>
            <div style={css("font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)")}>{R.fileSavedText}</div>
          </div>

          <div style={css("margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap")}>
            <span style={css("font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums")}>{R.frameCount} frames · {R.totalMs}</span>
            <Hov onClick={R.openTileSheet} s="display:flex;align-items:center;gap:7px;padding:7px 11px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;color:var(--dim)" sh="color:var(--fg);border-color:rgba(236,231,222,.3)"><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M3 3h7v7H3z"></path><path d="M14 3h7v7h-7z"></path><path d="M3 14h7v7H3z"></path><path d="M14 14h7v7h-7z"></path></svg>Tile Set</Hov>
            <button onClick={R.openSheet} className="btn btn-primary" style={css("gap:8px")}><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M9 3v18"></path><path d="M15 3v18"></path><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>Sprite Sheet</button>
          </div>
        </header>

        <div style={css("display:flex;align-items:center;gap:14px;height:38px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line)")}>
          <div style={css("display:flex;align-items:center;gap:3px;flex:none")}>
            {R.viewToggles.map((vt,i)=>(
              <Hov key={i} onClick={vt.click} title={vt.tip} s="position:relative;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11px;letter-spacing:.05em;color:var(--dim);white-space:nowrap" sh="color:var(--fg);border-color:rgba(236,231,222,.3)">
                {vt.on && <span style={css("position:absolute;inset:-1px;border:1px solid var(--gold);background:rgba(225,173,102,.15);border-radius:4px")}></span>}
                <span style={css("position:relative;display:block")}>{vt.icon}</span>
                <span style={css("position:relative")}>{vt.label}</span>
              </Hov>
            ))}
          </div>

          <div style={css("width:1px;height:20px;background:var(--line);flex:none")}></div>

          <div style={css("display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap")}>
            <span style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)")}>Size</span>
            <div style={css("display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden")}>
              {R.sizes.map((sz,i)=>(
                <Hov key={i} onClick={sz.pick} title={sz.title} s="position:relative;padding:4px 8px;background:transparent;border:0;border-left:1px solid var(--line);font-size:11px;letter-spacing:.05em;font-variant-numeric:tabular-nums;color:var(--dim);cursor:pointer" sh="color:var(--fg)">
                  {sz.on && <span style={css("position:absolute;inset:0;background:rgba(225,173,102,.14);box-shadow:inset 0 0 0 1px var(--gold)")}></span>}
                  <span style={css("position:relative")}>{sz.label}</span>
                </Hov>
              ))}
            </div>
            <CommitInput value={R.dimsText} commit={R.setDimsText} title={R.dimsTitle} style={css("width:62px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:11px;text-align:center;font-variant-numeric:tabular-nums;padding:4px 4px;outline:none")} />
          </div>

          <div style={css("display:flex;align-items:center;gap:2px;flex:none;border:1px solid var(--line);border-radius:4px;padding:1px")}>
            <Hov title="Zoom out" onClick={R.zoomOut} s="width:24px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:3px;cursor:pointer;color:var(--dim)" sh="color:var(--fg);background:rgba(236,231,222,.08)"><svg width="14" height="14" viewBox="0 0 24 24" className="ic"><path d="M5 12h14"></path></svg></Hov>
            <span style={css("min-width:52px;text-align:center;font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums")}>{R.zoomText}</span>
            <Hov title="Zoom in" onClick={R.zoomIn} s="width:24px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:3px;cursor:pointer;color:var(--dim)" sh="color:var(--fg);background:rgba(236,231,222,.08)"><svg width="14" height="14" viewBox="0 0 24 24" className="ic"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></Hov>
            <Hov title="Fit to view" onClick={R.zoomFit} s="padding:0 8px;height:22px;background:transparent;border:0;border-left:1px solid var(--line);cursor:pointer;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase" sh="color:var(--gold)">Fit</Hov>
          </div>

          {R.isShapeTool && (
            <Hov onClick={R.toggleShapeFill} title="Filled vs outline shapes — or hold Alt while dragging" s="position:relative;display:flex;align-items:center;height:26px;padding:0 11px;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11px;letter-spacing:.05em;color:var(--dim);white-space:nowrap" sh="color:var(--fg);border-color:rgba(236,231,222,.3)">
              {R.shapeFill && <span style={css("position:absolute;inset:-1px;border:1px solid var(--gold);background:rgba(225,173,102,.15);border-radius:4px")}></span>}
              <span style={css("position:relative")}>{R.shapeFill ? 'Filled' : 'Outline'}</span>
            </Hov>

                          <div style={css("display:grid;grid-template-columns:1fr 1fr;gap:6px;width:250px;flex:none")}>
                            {R.cornerCells.map((cell,i)=>(
                              <label key={i} style={css("display:flex;flex-direction:column;gap:3px")}>
                                <span style={css("font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)")}>{cell.pos}</span>
                                <select value={cell.value} onChange={cell.set} style={css("width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:11.5px;padding:5px 6px;outline:none;cursor:pointer")}>
                                  <option value="">—</option>
                                  {R.terrainsList.map((tn,j)=>(<option key={j} value={tn}>{tn}</option>))}
                                </select>
                              </label>
                            ))}
                          </div>
                          <div style={css("flex:1;min-width:0;font-size:10.5px;color:var(--dim);line-height:1.55")}>
                            <div style={css("margin-bottom:9px")}>Each corner stores the terrain that meets there — one representation covers every edge, outer/inner corner and junction.</div>
                            <label style={css("display:flex;align-items:center;gap:7px")}>
                              <span style={css("font-size:10px;color:var(--dim);white-space:nowrap")}>Fill all:</span>
                              <select value="" onChange={R.fillAllCorners} style={css("flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:11px;padding:4px 6px;outline:none;cursor:pointer")}>
                                <option value="">choose…</option>
                                {R.terrainsList.map((tn,j)=>(<option key={j} value={tn}>{tn}</option>))}
                              </select>
                            </label>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div style={css("margin-bottom:15px;font-size:10.5px;color:var(--dim);font-style:italic")}>Corners apply to Terrain tiles — set Kind to “Terrain” to assign a terrain to each corner.</div>
                    )}

                    <div style={css("display:flex;align-items:center;gap:16px")}>
                      <label style={css("display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;flex:none")}>
                        <input type="checkbox" checked={R.inspCollision} onChange={R.setInspCollision} style={css("width:14px;height:14px;accent-color:var(--gold);margin:0")} />Collision
                      </label>
                      <div style={css("flex:1;min-width:0;display:flex;align-items:center;gap:8px")}>
                        <span style={css("font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap")}>Tags</span>
                        <input value={R.inspTags} onChange={R.setInspTags} placeholder="comma, separated" style={css("flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--fg);font-size:11.5px;outline:none")} />
                      </div>
                    </div>
                  </div>
                </div>
                <div style={css("padding:20px;display:flex;flex-direction:column;gap:16px")}>
                  <div>
                    <div style={css("font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:8px")}>Layout</div>
                    <div style={css("display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden")}>
                      {R.tileLayouts.map((l,i)=>(
                        <Hov key={i} onClick={l.pick} s="position:relative;flex:1;padding:7px 0;background:transparent;border:0;border-left:1px solid var(--line);font-size:11px;color:var(--dim);cursor:pointer" sh="color:var(--fg)">
                          {l.on && <span style={css("position:absolute;inset:0;background:rgba(225,173,102,.14);box-shadow:inset 0 0 0 1px var(--gold)")}></span>}
                          <span style={css("position:relative")}>{l.label}</span>
                        </Hov>
                      ))}
                    </div>
                  </div>
                  {R.tileIsGrid && (
                    <div style={css("display:flex;align-items:center;justify-content:space-between;gap:12px")}>
                      <span style={css("font-size:12px;color:var(--dim)")}>Columns</span>
                      <div style={css("display:flex;align-items:center;border:1px solid var(--line);border-radius:4px")}>
                        <Hov onClick={R.tileColsDown} s="width:26px;height:28px;background:transparent;border:0;color:var(--dim);cursor:pointer" sh="color:var(--gold)">–</Hov>
                        <span style={css("width:30px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums")}>{R.tileCols}</span>
                        <Hov onClick={R.tileColsUp} s="width:26px;height:28px;background:transparent;border:0;color:var(--dim);cursor:pointer" sh="color:var(--gold)">+</Hov>
                      </div>
                    </div>
                  )}
                  <div style={css("display:flex;align-items:center;justify-content:space-between;gap:12px")}>
                    <span style={css("font-size:12px;color:var(--dim)")}>Spacing</span>
                    <div style={css("display:flex;align-items:center;gap:9px")}>
                      <input type="range" min="0" max="8" step="1" value={R.tileSpacing} onChange={R.setTileSpacing} style={css("width:112px;accent-color:var(--gold)")} />
                      <span style={css("width:26px;font-size:12px;font-variant-numeric:tabular-nums")}>{R.tileSpacing}</span>
                    </div>
                  </div>
                  <div style={css("display:flex;align-items:center;justify-content:space-between;gap:12px")}>
                    <span style={css("font-size:12px;color:var(--dim)")}>Padding</span>
                    <div style={css("display:flex;align-items:center;gap:9px")}>
                      <input type="range" min="0" max="16" step="1" value={R.tilePadding} onChange={R.setTilePadding} style={css("width:112px;accent-color:var(--gold)")} />
                      <span style={css("width:26px;font-size:12px;font-variant-numeric:tabular-nums")}>{R.tilePadding}</span>
                    </div>
                  </div>
                  <label style={css("display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);cursor:pointer")}>
                    <input type="checkbox" checked={R.tileTransparent} onChange={R.setTileTransparent} style={css("width:14px;height:14px;accent-color:var(--gold);margin:0")} />Transparent background
                  </label>
                  <div style={css("border:1px solid var(--line);border-radius:4px;padding:10px 11px")}>
                    <div style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px")}>tileset.json</div>
                    <div style={css("font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.6")}>
                      {R.tileMetaNames.map((mn,i)=>(<div key={i}>{mn.line}</div>))}
                    </div>
                  </div>
                  <div style={css("display:flex;flex-direction:column;gap:7px;margin-top:auto")}>
                    <button onClick={R.exportTileSet} className="btn btn-primary" style={css("width:100%;gap:8px;padding:10px")}><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M12 4v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>Export Tile Set PNG</button>
                    <Hov onClick={R.exportTileMeta} s="width:100%;padding:8px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11.5px;cursor:pointer" sh="color:var(--fg);border-color:rgba(236,231,222,.3)">Export tileset.json metadata</Hov>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {R.atlasSheetOpen && (
          <div onClick={R.closeAtlasSheet} style={css("position:fixed;inset:0;background:rgba(10,9,7,.72);display:flex;align-items:center;justify-content:center;z-index:50")}>
            <div onClick={R.stop} style={css("width:900px;max-width:94vw;max-height:90vh;overflow:auto;background:var(--bg1);border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 70px rgba(0,0,0,.6)")}>
              <div style={css("display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)")}>
                <div>
                  <div style={css("font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.1")}>Atlas Packer</div>
                  <div style={css("font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:3px")}>Nest free-size sprites into one sheet</div>
                </div>
                <Hov onClick={R.closeAtlasSheet} s="width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--dim);cursor:pointer" sh="color:var(--fg)"><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></Hov>
              </div>
              <div style={css("display:grid;grid-template-columns:1fr 300px")}>
                <div style={css("padding:20px;border-right:1px solid var(--line);min-width:0")}>
                  <div style={css("display:flex;align-items:center;justify-content:space-between;margin-bottom:10px")}>
                    <span style={css("font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)")}>Packed preview</span>
                    <span style={css("font-size:10px;color:var(--dim);font-style:italic")}>Click a sprite to inspect it</span>
                  </div>
                  <div style={css("display:flex;align-items:center;justify-content:center;min-height:280px;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg0)")}>
                    <canvas ref={R.atlasSheetRef} onPointerDown={R.atlasSheetDown} style={css("display:block;image-rendering:pixelated;cursor:pointer;box-shadow:0 0 0 1px rgba(236,231,222,.14)")}></canvas>
                  </div>

                  <div style={css("margin-top:18px;padding-top:16px;border-top:1px solid var(--line)")}>
                    <div style={css("display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px")}>
                      <span style={css("font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)")}>Sprite inspector</span>
                      <span style={css("font-size:11px;color:var(--fg)")}>{R.atlasInspName}</span>
                    </div>
                    {R.hasAtlasSel ? (
                      <div style={css("display:flex;flex-direction:column;gap:14px")}>
                        <div style={css("display:flex;align-items:center;gap:16px;flex-wrap:wrap")}>
                          <div style={css("display:flex;align-items:center;gap:8px")}>
                            <span style={css("font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)")}>Size</span>
                            <CommitInput value={R.atlasItemW} commit={R.setAtlasItemW} title="Sprite width" style={css("width:48px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:12px;text-align:center;font-variant-numeric:tabular-nums;padding:5px 4px;outline:none")} />
                            <span style={css("font-size:12px;color:var(--dim)")}>×</span>
                            <CommitInput value={R.atlasItemH} commit={R.setAtlasItemH} title="Sprite height" style={css("width:48px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--fg);font-size:12px;text-align:center;font-variant-numeric:tabular-nums;padding:5px 4px;outline:none")} />
                            <span style={css("font-size:11px;color:var(--dim)")}>px</span>
                          </div>
                          <label style={css("display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer")}>
                            <input type="checkbox" checked={R.atlasItemCollision} onChange={R.setAtlasItemCollision} style={css("width:14px;height:14px;accent-color:var(--gold);margin:0")} />Collision
                          </label>
                        </div>
                        <div>
                          <div style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:7px")}>Kind</div>
                          <div style={css("display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden")}>
                            {R.atlasKinds.map((k,i)=>(
                              <Hov key={i} onClick={k.pick} s="position:relative;flex:1;padding:6px 0;background:transparent;border:0;border-left:1px solid var(--line);font-size:11px;color:var(--dim);cursor:pointer" sh="color:var(--fg)">
                                {k.on && <span style={css("position:absolute;inset:0;background:rgba(225,173,102,.14);box-shadow:inset 0 0 0 1px var(--gold)")}></span>}
                                <span style={css("position:relative")}>{k.label}</span>
                              </Hov>
                            ))}
                          </div>
                        </div>
                        <div style={css("display:flex;align-items:center;gap:8px")}>
                          <span style={css("font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap")}>Tags</span>
                          <input value={R.atlasItemTags} onChange={R.setAtlasItemTags} placeholder="comma, separated" style={css("flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--fg);font-size:11.5px;outline:none")} />
                        </div>
                      </div>
                    ) : (
                      <div style={css("font-size:10.5px;color:var(--dim);font-style:italic")}>No sprites to inspect.</div>
                    )}
                  </div>
                  <div style={css("display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden")}>
                    <div style={css("background:var(--bg1);padding:10px 12px")}>
                      <div style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)")}>Sprites</div>
                      <div style={css("font-size:18px;font-family:'Cormorant Garamond',serif;font-variant-numeric:tabular-nums;margin-top:2px")}>{R.atlasSheetCount}</div>
                    </div>
                    <div style={css("background:var(--bg1);padding:10px 12px")}>
                      <div style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)")}>Sheet size</div>
                      <div style={css("font-size:18px;font-family:'Cormorant Garamond',serif;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--gold)")}>{R.atlasSheetDim}</div>
                    </div>
                  </div>
                </div>
                <div style={css("padding:20px;display:flex;flex-direction:column;gap:16px")}>
                  <div style={css("display:flex;align-items:center;justify-content:space-between;gap:12px")}>
                    <span style={css("font-size:12px;color:var(--dim)")}>Spacing</span>
                    <div style={css("display:flex;align-items:center;gap:9px")}>
                      <input type="range" min="0" max="8" step="1" value={R.atlasSpacing} onChange={R.setAtlasSpacing} style={css("width:112px;accent-color:var(--gold)")} />
                      <span style={css("width:26px;font-size:12px;font-variant-numeric:tabular-nums")}>{R.atlasSpacing}</span>
                    </div>
                  </div>
                  <div style={css("display:flex;align-items:center;justify-content:space-between;gap:12px")}>
                    <span style={css("font-size:12px;color:var(--dim)")}>Padding</span>
                    <div style={css("display:flex;align-items:center;gap:9px")}>
                      <input type="range" min="0" max="16" step="1" value={R.atlasPadding} onChange={R.setAtlasPadding} style={css("width:112px;accent-color:var(--gold)")} />
                      <span style={css("width:26px;font-size:12px;font-variant-numeric:tabular-nums")}>{R.atlasPadding}</span>
                    </div>
                  </div>
                  <label style={css("display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);cursor:pointer")}>
                    <input type="checkbox" checked={R.atlasTransparent} onChange={R.setAtlasTransparent} style={css("width:14px;height:14px;accent-color:var(--gold);margin:0")} />Transparent background
                  </label>
                  <div style={css("border:1px solid var(--line);border-radius:4px;padding:10px 11px;max-height:180px;overflow:auto")}>
                    <div style={css("font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px")}>atlas.json</div>
                    <div style={css("font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.6")}>
                      {R.atlasMetaNames.map((mn,i)=>(<div key={i}>{mn.line}</div>))}
                    </div>
                  </div>
                  <div style={css("display:flex;flex-direction:column;gap:7px;margin-top:auto")}>
                    <button onClick={R.exportAtlasSet} className="btn btn-primary" style={css("width:100%;gap:8px;padding:10px")}><svg width="15" height="15" viewBox="0 0 24 24" className="ic"><path d="M12 4v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>Export Atlas PNG</button>
                    <Hov onClick={R.exportAtlasMeta} s="width:100%;padding:8px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11.5px;cursor:pointer" sh="color:var(--fg);border-color:rgba(236,231,222,.3)">Export atlas.json metadata</Hov>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        <input type="file" accept=".pixelproj,application/json" ref={R.projRef} onChange={R.onOpenProject} style={css("display:none")} />
        <input type="file" accept="image/*" ref={R.fileRef} onChange={R.onImport} style={css("display:none")} />
        <input type="file" accept="image/*" ref={R.refInputRef} onChange={R.onLoadRef} style={css("display:none")} />
      </div>
    );
  }

}

const DEFAULTS = {
  accent: '#e1ad66',
  showGridDefault: true,
  tileDefault: false,
  onionDefault: false,
  onionOpacityDefault: 35,
  shadeModeDefault: 'Palette ramp'
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Component, DEFAULTS));
</script>
</body>
</html>
